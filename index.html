<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Тетрадь заметок</title>
<meta name="theme-color" content="#3554d1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Literata:opsz,wght@7..72,500;7..72,600&display=swap">
<style>
/* Layout: три колонки — папки | заметки | редактор; на телефоне папки становятся вкладками, редактор открывается поверх списка */
:root{
  --bg:#f6f7f9; --panel:#ffffff; --line:#e3e6ec; --fg:#1d2330; --muted:#6b7385;
  --accent:#3554d1; --accent-soft:#e8ecfb; --done:#9aa1b0; --danger:#c0392b; --ok:#2e8b57;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-title:"Literata",Georgia,"Times New Roman",serif;
  --r:8px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#14171e; --panel:#1b1f28; --line:#2b313d; --fg:#e6e9ef; --muted:#8e96a8;
  --accent:#8aa2ff; --accent-soft:#252d4a; --done:#5d6578; --danger:#ff7b6b; --ok:#5fcf8f; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.app{height:100%;display:grid;grid-template-columns:220px 280px minmax(0,1fr);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.col{min-width:0;display:flex;flex-direction:column;overflow:hidden}
.folders{border-right:1px solid var(--line);padding:20px 12px;gap:4px}
.list{border-right:1px solid var(--line);background:var(--panel)}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 8px 8px;display:flex;justify-content:space-between;align-items:center}
.folder{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:var(--r);text-align:left;width:100%}
.folder:hover{background:var(--accent-soft)}
.folder.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
.folder .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.folder .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.icon-btn{width:28px;height:28px;border-radius:6px;display:inline-grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--accent-soft);color:var(--accent)}
.list-head{display:flex;align-items:center;justify-content:space-between;padding:20px 16px 12px;gap:8px}
.list-head h2{margin:0;font-family:var(--f-title);font-size:20px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.notes{overflow-y:auto;flex:1;padding:0 8px 16px;display:flex;flex-direction:column;gap:2px}
.note{text-align:left;padding:10px;border-radius:var(--r);width:100%}
.note:hover{background:var(--bg)}
.note.on{background:var(--accent-soft)}
.note b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note span{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:var(--muted);padding:12px 10px;font-size:14px}
.editor{background:var(--panel)}
.ed-bar{display:flex;align-items:center;gap:6px;padding:14px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ed-bar .sp{flex:1}
.chip{padding:6px 10px;border-radius:6px;border:1px solid var(--line);font-size:13px}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.chip.primary:hover{color:var(--panel);opacity:.9}
.chip.danger:hover{border-color:var(--danger);color:var(--danger)}
.back{display:none}
.ed-body{overflow-y:auto;flex:1;padding:28px 32px 80px}
.ed-inner{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.title{font-family:var(--f-title);font-size:28px;font-weight:600;border:0;background:none;color:var(--fg);width:100%;padding:0;margin-bottom:6px}
.title::placeholder{color:var(--done)}
.meta{font-size:12px;color:var(--muted);margin-bottom:14px}
.block{display:flex;align-items:flex-start;gap:10px}
.block textarea{flex:1;min-width:0;border:0;background:none;color:var(--fg);font:inherit;resize:none;padding:2px 0;overflow:hidden;line-height:1.55}
.block textarea::placeholder{color:var(--done)}
.block.check input{appearance:none;-webkit-appearance:none;width:18px;height:18px;margin:4px 0 0;flex:none;border:1.5px solid var(--muted);border-radius:5px;display:grid;place-items:center;cursor:pointer}
.block.check input:checked{background:var(--accent);border-color:var(--accent)}
.block.check input:checked::after{content:"";width:5px;height:9px;border:solid var(--panel);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.block.check.done textarea{color:var(--done);text-decoration:line-through}
.block .del{opacity:0;width:24px;height:24px;border-radius:5px;color:var(--muted);flex:none}
.block:hover .del,.block:focus-within .del{opacity:1}
.del:hover{background:var(--accent-soft)}
.progress{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.placeholder{flex:1;display:grid;place-items:center;color:var(--muted);text-align:center;padding:24px}
.inline-input{width:100%;padding:7px 8px;border:1px solid var(--accent);border-radius:var(--r);background:var(--panel);color:var(--fg);font:inherit}
.foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:8px}
.sync{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);text-align:left;padding:6px 8px;border-radius:var(--r)}
.sync:hover{background:var(--accent-soft)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--done);flex:none}
.dot.ok{background:var(--ok)} .dot.busy{background:var(--accent)} .dot.err{background:var(--danger)}
.confirm{display:flex;gap:6px;align-items:center;font-size:13px}

/* Окно аккаунта */
.sheet{position:fixed;inset:0;background:rgba(10,14,25,.45);display:grid;place-items:center;padding:16px;z-index:10}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:100%;max-width:400px;padding:22px;display:flex;flex-direction:column;gap:12px;max-height:100%;overflow-y:auto}
.card h3{margin:0;font-family:var(--f-title);font-size:20px}
.card p{margin:0;color:var(--muted);font-size:14px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.field input{padding:9px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);color:var(--fg);font:inherit}
.row{display:flex;gap:8px;flex-wrap:wrap}
.msg{font-size:13px;min-height:1em}
.msg.err{color:var(--danger)} .msg.ok{color:var(--ok)}
hr{border:0;border-top:1px solid var(--line);margin:4px 0}

@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);
    padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
  .folders{border:0;flex-direction:row;overflow-x:auto;padding:12px 0;gap:6px;align-items:center}
  .folders .label{display:none}
  .foot{margin:0;padding:0;flex:none;order:99}
  .sync span:last-child{display:none}
  .folder{width:auto;flex:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px}
  .folder.on{border-color:var(--accent)}
  .add-folder-m{display:inline-grid!important;flex:none}
  .list,.editor{border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px}
  .editor{grid-row:2}
  .app.reading .list{display:none}
  .app:not(.reading) .editor{display:none}
  .back{display:inline-block}
  .ed-body{padding:20px 16px 60px}
  .block .del{opacity:1}
}
.add-folder-m{display:none!important}
@media (prefers-reduced-motion:no-preference){.folder,.note,.chip{transition:background .12s,border-color .12s,color .12s}}
</style>
</head>
<body>
<div class="app" id="app">
  <nav class="col folders" id="folders" aria-label="Папки"></nav>
  <section class="col list" id="list"></section>
  <section class="col editor" id="editor"></section>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="card" role="dialog" aria-labelledby="sheetTitle">
    <h3 id="sheetTitle">Синхронизация</h3>
    <div id="sheetBody"></div>
    <hr>
    <p>Резервная копия всех заметок в файл:</p>
    <div class="row">
      <button class="chip" id="exportBtn">Скачать копию</button>
      <button class="chip" id="importBtn">Загрузить из файла</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
    <div class="msg" id="backupMsg"></div>
    <div class="row" style="justify-content:flex-end"><button class="chip" id="closeSheet">Закрыть</button></div>
  </div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
"use strict";
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const LS = "notes-pwa-v1";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ================= Данные ================= */
function sample(){
  const now = Date.now();
  const b = (type, text, done=false) => ({id:uid(), type, text, done});
  return {
    folders:[
      {id:"f1",name:"Личное",updated:now,notes:[
        {id:"n1",title:"Пример: покупки на выходные",updated:now,blocks:[b("check","Молоко",true),b("check","Хлеб"),b("check","Яблоки, 1 кг"),b("text","Заодно заглянуть в аптеку.")]}]},
      {id:"f2",name:"Работа",updated:now,notes:[
        {id:"n2",title:"Пример: задачи на неделю",updated:now-3600000,blocks:[b("check","Отправить отчёт"),b("check","Созвон с командой в четверг",true)]}]}
    ],
    deleted:{},
    cur:{folder:"f1",note:"n1"}
  };
}
function normalize(s){
  if(!s || !Array.isArray(s.folders)) return null;
  s.deleted = s.deleted || {};
  s.cur = s.cur || {folder:null,note:null};
  s.folders.forEach(f => { f.updated = f.updated || 0; f.notes = f.notes || []; f.notes.forEach(n => { n.blocks = n.blocks || []; n.updated = n.updated || 0; }); });
  return s;
}
let state;
try{ state = normalize(JSON.parse(localStorage.getItem(LS))); }catch(e){}
if(!state) state = sample();

function saveLocal(){ try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){} }
function changed(){ saveLocal(); scheduleSync(); }

/* Слияние двух версий: побеждает более свежая правка каждой заметки и папки, удаления запоминаются */
function merge(a, b){
  const deleted = {...(a.deleted||{})};
  for(const [k,v] of Object.entries(b.deleted||{})) deleted[k] = Math.max(deleted[k]||0, v);
  const fa = new Map(a.folders.map(f => [f.id,f])), fb = new Map(b.folders.map(f => [f.id,f]));
  const order = [...a.folders.map(f=>f.id), ...b.folders.map(f=>f.id).filter(id => !fa.has(id))];
  const folders = [];
  for(const id of order){
    const x = fa.get(id), y = fb.get(id);
    const newer = !x ? y : !y ? x : ((y.updated||0) > (x.updated||0) ? y : x);
    const notes = new Map();
    for(const n of [...(x?x.notes:[]), ...(y?y.notes:[])]){
      const had = notes.get(n.id);
      if(!had || (n.updated||0) > (had.updated||0)) notes.set(n.id, n);
    }
    const alive = [...notes.values()].filter(n => !(deleted[n.id] >= (n.updated||0)));
    if(deleted[id] >= (newer.updated||0)) continue;
    folders.push({id, name:newer.name, updated:newer.updated||0, notes:alive});
  }
  // удаления старше месяца больше не нужны
  const month = Date.now() - 30*864e5;
  for(const k of Object.keys(deleted)) if(deleted[k] < month) delete deleted[k];
  return {folders, deleted, cur:a.cur};
}
const strip = s => JSON.stringify({folders:s.folders, deleted:s.deleted});

/* ================= Синхронизация ================= */
const CFG = window.NOTES_CONFIG || {};
const cloudConfigured = !!(CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY && window.supabase);
let sb = null, session = null;
let sync = {state: cloudConfigured ? "signedout" : "local", at: null, error: ""};
let syncTimer = null, syncing = false, again = false;

if(cloudConfigured){
  sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, {auth:{persistSession:true, autoRefreshToken:true}});
}

function setSync(st, err=""){ sync.state = st; sync.error = err; if(st === "ok") sync.at = Date.now(); renderSync(); if(!$("#sheet").hidden) renderSheet(); }
function scheduleSync(delay=1200){ if(!session) return; clearTimeout(syncTimer); syncTimer = setTimeout(doSync, delay); }

async function doSync(){
  if(!sb || !session) return;
  if(syncing){ again = true; return; }
  if(!navigator.onLine){ setSync("offline"); return; }
  syncing = true; setSync("busy");
  try{
    const {data, error} = await sb.from("notes_state").select("data").eq("user_id", session.user.id).maybeSingle();
    if(error) throw error;
    const remote = data && normalize(data.data);
    const before = strip(state);
    const merged = remote ? merge(state, remote) : state;
    if(!remote || strip(merged) !== strip(remote)){
      const {error: e2} = await sb.from("notes_state").upsert({user_id: session.user.id, data: {folders:merged.folders, deleted:merged.deleted}, updated_at: new Date().toISOString()});
      if(e2) throw e2;
    }
    if(strip(merged) !== before) applyRemote(merged);
    setSync("ok");
  }catch(e){
    setSync(navigator.onLine ? "error" : "offline", e && e.message ? e.message : String(e));
  }finally{
    syncing = false;
    if(again){ again = false; scheduleSync(300); }
  }
}

/* Применить пришедшие изменения, не сбивая курсор, если открытая заметка не поменялась */
function applyRemote(merged){
  const curBefore = JSON.stringify(note() || null);
  state.folders = merged.folders; state.deleted = merged.deleted;
  if(!folder()) state.cur = {folder: state.folders[0]?.id || null, note: state.folders[0]?.notes[0]?.id || null};
  if(!note()) state.cur.note = null;
  saveLocal();
  const editing = document.activeElement && $("#editor").contains(document.activeElement);
  if(editing && JSON.stringify(note() || null) === curBefore){ renderFolders(); renderList(); }
  else render();
}

if(sb){
  sb.auth.onAuthStateChange((_ev, s) => {
    const was = session; session = s;
    if(s && !was) doSync();
    if(!s) setSync("signedout");
  });
}
window.addEventListener("online", () => scheduleSync(200));
window.addEventListener("offline", () => session && setSync("offline"));
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") scheduleSync(200); });
setInterval(() => { if(document.visibilityState === "visible") scheduleSync(0); }, 60000);

function syncLabel(){
  const t = sync.at ? new Date(sync.at).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"}) : "";
  return {
    local:"Только на этом устройстве",
    signedout:"Войдите для синхронизации",
    busy:"Синхронизирую…",
    ok:"Синхронизировано " + t,
    offline:"Нет сети, сохранено на устройстве",
    error:"Ошибка синхронизации"
  }[sync.state];
}
function dotClass(){ return {ok:"ok",busy:"busy",error:"err"}[sync.state] || ""; }
function renderSync(){
  const el = $("#syncBtn"); if(!el) return;
  el.innerHTML = `<span class="dot ${dotClass()}"></span><span>${esc(syncLabel())}</span>`;
  el.title = syncLabel();
}

/* ================= Окно аккаунта ================= */
function openSheet(){ $("#sheet").hidden = false; $("#backupMsg").textContent = ""; renderSheet(); }
function renderSheet(){
  const b = $("#sheetBody");
  if(!cloudConfigured){
    b.innerHTML = `<p>Синхронизация не настроена. Заметки хранятся только на этом устройстве. Чтобы включить её, заполните файл config.js по инструкции.</p>`;
    return;
  }
  if(session){
    b.innerHTML = `<p>Вы вошли как <b>${esc(session.user.email)}</b>.</p>
      <p style="margin-top:8px">${esc(syncLabel())}${sync.error ? ": " + esc(sync.error) : ""}</p>
      <div class="row" style="margin-top:12px"><button class="chip primary" id="syncNow">Синхронизировать</button><button class="chip" id="signOut">Выйти</button></div>`;
    return;
  }
  if(b.querySelector("#email")) return; // не стирать введённое
  b.innerHTML = `<form id="authForm" style="display:flex;flex-direction:column;gap:10px">
      <p>Войдите под одним аккаунтом на всех устройствах, и заметки будут общими.</p>
      <label class="field">Почта<input id="email" type="email" autocomplete="email" required></label>
      <label class="field">Пароль, не короче 6 символов<input id="password" type="password" autocomplete="current-password" minlength="6" required></label>
      <div class="row"><button class="chip primary" type="submit" id="signIn">Войти</button><button class="chip" type="button" id="signUp">Создать аккаунт</button></div>
      <div class="msg" id="authMsg"></div></form>`;
}
async function auth(kind){
  const email = $("#email").value.trim(), password = $("#password").value, msg = $("#authMsg");
  if(!email || password.length < 6){ msg.className = "msg err"; msg.textContent = "Введите почту и пароль не короче 6 символов."; return; }
  msg.className = "msg"; msg.textContent = kind === "in" ? "Вхожу…" : "Создаю аккаунт…";
  const {data, error} = kind === "in"
    ? await sb.auth.signInWithPassword({email, password})
    : await sb.auth.signUp({email, password});
  if(error){
    msg.className = "msg err";
    msg.textContent = /Invalid login/i.test(error.message) ? "Неверная почта или пароль."
      : /already registered/i.test(error.message) ? "Такой аккаунт уже есть, нажмите «Войти»."
      : /not confirmed/i.test(error.message) ? "Почта не подтверждена. Откройте письмо от Supabase и перейдите по ссылке."
      : error.message;
    return;
  }
  if(kind === "up" && !data.session){ msg.className = "msg ok"; msg.textContent = "Аккаунт создан. Подтвердите почту по ссылке из письма, затем войдите."; return; }
  renderSheet();
}
$("#sheet").addEventListener("submit", e => { if(e.target.id === "authForm"){ e.preventDefault(); auth("in"); } });
$("#sheet").addEventListener("click", async e => {
  const id = e.target.id;
  if(e.target === $("#sheet") || id === "closeSheet") $("#sheet").hidden = true;
  if(id === "signUp") auth("up");
  if(id === "signOut"){ await sb.auth.signOut(); renderSheet(); }
  if(id === "syncNow") doSync();
  if(id === "exportBtn") exportBackup();
  if(id === "importBtn") $("#importFile").click();
});
document.addEventListener("keydown", e => { if(e.key === "Escape" && !$("#sheet").hidden) $("#sheet").hidden = true; });

function exportBackup(){
  const blob = new Blob([JSON.stringify({folders:state.folders, deleted:state.deleted}, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "заметки-" + new Date().toISOString().slice(0,10) + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  $("#backupMsg").className = "msg ok"; $("#backupMsg").textContent = "Файл сохранён в загрузки.";
}
$("#importFile").addEventListener("change", async e => {
  const f = e.target.files[0]; if(!f) return;
  const m = $("#backupMsg");
  try{
    const s = normalize(JSON.parse(await f.text()));
    if(!s) throw new Error();
    const merged = merge(state, s);
    state.folders = merged.folders; state.deleted = merged.deleted;
    if(!folder()) state.cur = {folder: state.folders[0]?.id || null, note:null};
    changed(); render();
    m.className = "msg ok"; m.textContent = "Заметки из файла добавлены.";
  }catch(err){ m.className = "msg err"; m.textContent = "Это не файл копии заметок."; }
  e.target.value = "";
});

/* ================= Интерфейс ================= */
let reading = false, editingFolder = null, confirmDel = null;
const folder = () => state.folders.find(f => f.id === state.cur.folder) || state.folders[0];
const note = () => { const f = folder(); return f && f.notes.find(n => n.id === state.cur.note); };

function when(t){
  const d = new Date(t), now = new Date();
  return d.toDateString() === now.toDateString()
    ? d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})
    : d.toLocaleDateString("ru-RU",{day:"numeric",month:"short"});
}
function preview(n){
  const checks = n.blocks.filter(b => b.type === "check");
  const first = n.blocks.find(b => b.text.trim());
  const p = checks.length ? `${checks.filter(b=>b.done).length}/${checks.length} · ` : "";
  return when(n.updated) + " · " + p + (first ? first.text : "Пусто");
}

function renderFolders(){
  const el = $("#folders"), cur = folder();
  el.innerHTML = `<div class="label">Папки <button class="icon-btn" id="addFolder" title="Новая папка" aria-label="Новая папка">+</button></div>` +
    state.folders.map(f => editingFolder === f.id
      ? `<input class="inline-input" id="folderName" value="${esc(f.name)}" aria-label="Название папки">`
      : `<button class="folder ${cur && f.id===cur.id?"on":""}" data-f="${f.id}"><span class="name">${esc(f.name)}</span><span class="n">${f.notes.length}</span></button>`
    ).join("") +
    `<button class="icon-btn add-folder-m" id="addFolderM" aria-label="Новая папка">+</button>` +
    `<div class="foot"><button class="sync" id="syncBtn"></button></div>`;
  renderSync();
  const inp = $("#folderName");
  if(inp){
    inp.focus(); inp.select();
    const done = () => {
      const f = state.folders.find(x => x.id === editingFolder);
      if(f){ f.name = inp.value.trim() || "Без названия"; f.updated = Date.now(); }
      editingFolder = null; changed(); render();
    };
    inp.onblur = done;
    inp.onkeydown = e => { if(e.key === "Enter") inp.blur(); };
  }
}

function renderList(){
  const f = folder(), el = $("#list");
  if(!f){ el.innerHTML = `<div class="placeholder">Создайте первую папку кнопкой «+»</div>`; return; }
  const notes = [...f.notes].sort((a,b) => b.updated - a.updated);
  const tools = confirmDel === "folder"
    ? `<span class="confirm">Удалить папку? <button class="chip danger" id="yesDelFolder">Да</button><button class="chip" id="noDel">Нет</button></span>`
    : `<button class="icon-btn" id="renameFolder" title="Переименовать папку" aria-label="Переименовать папку">✎</button><button class="icon-btn" id="delFolder" title="Удалить папку" aria-label="Удалить папку">✕</button>`;
  el.innerHTML = `<div class="list-head"><h2>${esc(f.name)}</h2><div style="display:flex;gap:2px;flex:none">${tools}</div></div>
    <div style="padding:0 16px 10px"><button class="chip" id="addNote" style="width:100%">+ Новая заметка</button></div>
    <div class="notes">${notes.length ? notes.map(n =>
      `<button class="note ${n.id===state.cur.note?"on":""}" data-n="${n.id}"><b>${esc(n.title || "Без названия")}</b><span>${esc(preview(n))}</span></button>`
    ).join("") : `<div class="empty">В этой папке пока нет заметок.</div>`}</div>`;
}

function renderEditor(){
  const n = note(), el = $("#editor");
  if(!n){ el.innerHTML = `<div class="placeholder">Выберите заметку или создайте новую</div>`; return; }
  const checks = n.blocks.filter(b => b.type === "check");
  const del = confirmDel === "note"
    ? `<span class="confirm">Удалить заметку? <button class="chip danger" id="yesDelNote">Да</button><button class="chip" id="noDel">Нет</button></span>`
    : `<button class="chip danger" id="delNote">Удалить</button>`;
  el.innerHTML = `<div class="ed-bar">
      <button class="chip back" id="back">← Назад</button>
      <span class="sp"></span>
      ${checks.length ? `<span class="progress">Выполнено ${checks.filter(b=>b.done).length} из ${checks.length}</span>` : ""}
      ${del}
    </div>
    <div class="ed-body"><div class="ed-inner">
      <input class="title" id="title" placeholder="Название" value="${esc(n.title)}">
      <div class="meta">Изменено ${when(n.updated)}</div>
      <div id="blocks">${n.blocks.map((b,i,a) => blockHTML(b,i,a.length)).join("")}</div>
    </div></div>`;
  el.querySelectorAll("textarea").forEach(autosize);
}
function blockHTML(b, i, total){
  const box = b.type === "check" ? `<input type="checkbox" ${b.done?"checked":""} aria-label="Отметить">` : "";
  const ph = total === 1 && b.type === "text" ? "Пишите текст. Строка, начатая с [.], станет чекбоксом" : "";
  return `<div class="block ${b.type}${b.done?" done":""}" data-b="${b.id}">${box}
    <textarea rows="1" placeholder="${ph}">${esc(b.text)}</textarea></div>`;
}
function autosize(t){ t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; }
function render(){ renderFolders(); renderList(); renderEditor(); $("#app").classList.toggle("reading", reading && !!note()); }

function touch(){ const n = note(); if(n) n.updated = Date.now(); changed(); }
function refreshSide(){ renderList(); renderFolders(); }
/* Строка «[.] слово» становится чекбоксом; «[x] слово» — отмеченным */
const CHECK_RE = /^\[([.\sxх]?)\]\s/i;
function parseLine(line){
  const m = line.match(CHECK_RE);
  if(m) return {id:uid(), type:"check", text:line.slice(m[0].length), done:/[xх]/i.test(m[1])};
  return {id:uid(), type:"text", text:line, done:false};
}
function focusBlock(id, pos){
  const t = document.querySelector(`[data-b="${id}"] textarea`); if(!t) return;
  t.focus(); const p = pos == null ? t.value.length : pos; t.setSelectionRange(p, p);
}
function redraw(focusId, pos){ touch(); renderEditor(); refreshSide(); if(focusId) focusBlock(focusId, pos); }

$("#app").addEventListener("click", e => {
  const t = e.target.closest("button"); if(!t) return;
  const id = t.id, now = Date.now();
  if(t.dataset.f){ state.cur.folder = t.dataset.f; state.cur.note = folder().notes[0]?.id || null; confirmDel = null; reading = false; saveLocal(); render(); return; }
  if(t.dataset.n){ state.cur.note = t.dataset.n; confirmDel = null; reading = true; saveLocal(); render(); return; }
  if(id === "syncBtn"){ openSheet(); return; }
  if(id === "addFolder" || id === "addFolderM"){ const f = {id:uid(), name:"Новая папка", updated:now, notes:[]}; state.folders.push(f); state.cur = {folder:f.id, note:null}; editingFolder = f.id; changed(); render(); return; }
  if(id === "renameFolder"){ editingFolder = folder().id; render(); return; }
  if(id === "delFolder"){ confirmDel = "folder"; renderList(); return; }
  if(id === "yesDelFolder"){
    const f = folder(); state.deleted[f.id] = now; f.notes.forEach(n => state.deleted[n.id] = now);
    state.folders = state.folders.filter(x => x.id !== f.id);
    const nf = state.folders[0]; state.cur = {folder:nf?.id || null, note:nf?.notes[0]?.id || null};
    confirmDel = null; reading = false; changed(); render(); return;
  }
  if(id === "noDel"){ confirmDel = null; render(); return; }
  if(id === "addNote"){
    const f = folder(); const n = {id:uid(), title:"", updated:now, blocks:[{id:uid(),type:"text",text:"",done:false}]};
    f.notes.push(n); state.cur.note = n.id; reading = true; changed(); render(); $("#title")?.focus(); return;
  }
  if(id === "delNote"){ confirmDel = "note"; renderEditor(); return; }
  if(id === "yesDelNote"){
    const f = folder(); state.deleted[state.cur.note] = now;
    f.notes = f.notes.filter(n => n.id !== state.cur.note); state.cur.note = null;
    confirmDel = null; reading = false; changed(); render(); return;
  }
  if(id === "back"){ reading = false; render(); return; }
});

$("#app").addEventListener("input", e => {
  const n = note(); if(!n) return;
  if(e.target.id === "title"){ n.title = e.target.value; touch(); refreshSide(); return; }
  const blk = e.target.closest(".block"); if(!blk) return;
  const i = n.blocks.findIndex(x => x.id === blk.dataset.b); if(i < 0) return;
  const b = n.blocks[i];
  if(e.target.type === "checkbox"){ b.done = e.target.checked; redraw(); return; }
  const val = e.target.value;
  // вставка нескольких строк: каждая строка — отдельная, с учётом [.]
  if(val.includes("\n")){
    const lines = val.split(/\r?\n/);
    const first = parseLine(lines[0]);
    if(b.type === "text"){ b.type = first.type; b.done = first.done; }
    b.text = first.text;
    const rest = lines.slice(1).map(parseLine);
    n.blocks.splice(i + 1, 0, ...rest);
    const last = rest[rest.length - 1];
    redraw(last.id, last.text.length); return;
  }
  // набрали «[.] » в начале обычной строки — превращаем в чекбокс
  if(b.type === "text" && CHECK_RE.test(val)){
    const p = parseLine(val); b.type = "check"; b.text = p.text; b.done = p.done;
    redraw(b.id, Math.max(0, e.target.selectionStart - (val.length - p.text.length))); return;
  }
  b.text = val; autosize(e.target); touch(); refreshSide();
});

$("#app").addEventListener("keydown", e => {
  const n = note(); if(!n) return;
  if(e.target.id === "title" && (e.key === "Enter" || e.key === "ArrowDown")){
    e.preventDefault(); n.blocks.length ? focusBlock(n.blocks[0].id, 0) : (n.blocks.push(parseLine("")), redraw(n.blocks[0].id)); return;
  }
  const blk = e.target.closest && e.target.closest(".block");
  if(!blk || e.target.tagName !== "TEXTAREA") return;
  const t = e.target, i = n.blocks.findIndex(x => x.id === blk.dataset.b), b = n.blocks[i];
  const start = t.selectionStart, endSel = t.selectionEnd, collapsed = start === endSel;

  if(e.key === "Enter"){
    e.preventDefault();
    // Enter в пустом чекбоксе — выйти из списка
    if(b.type === "check" && t.value === ""){ b.type = "text"; b.done = false; redraw(b.id, 0); return; }
    const before = t.value.slice(0, start), after = t.value.slice(endSel);
    b.text = before;
    const nb = {id:uid(), type:b.type, text:after, done:false};
    n.blocks.splice(i + 1, 0, nb); redraw(nb.id, 0); return;
  }
  if(e.key === "Backspace" && collapsed && start === 0){
    // в начале чекбокса — снять чекбокс, текст остаётся
    if(b.type === "check"){ e.preventDefault(); b.type = "text"; b.done = false; redraw(b.id, 0); return; }
    // в начале строки — склеить с предыдущей
    if(i > 0){
      e.preventDefault(); const prev = n.blocks[i - 1], pos = prev.text.length;
      prev.text += b.text; n.blocks.splice(i, 1); redraw(prev.id, pos); return;
    }
  }
  if(e.key === "Delete" && collapsed && start === t.value.length && i < n.blocks.length - 1){
    e.preventDefault(); const next = n.blocks[i + 1];
    b.text += next.text; n.blocks.splice(i + 1, 1); redraw(b.id, start); return;
  }
  if(e.key === "ArrowUp" && collapsed && !t.value.slice(0, start).includes("\n") && t.value.slice(0,start).length === 0){
    if(i > 0){ e.preventDefault(); focusBlock(n.blocks[i - 1].id); } else { e.preventDefault(); $("#title")?.focus(); }
    return;
  }
  if(e.key === "ArrowDown" && collapsed && start === t.value.length && i < n.blocks.length - 1){
    e.preventDefault(); focusBlock(n.blocks[i + 1].id, 0);
  }
});

// клик по пустому месту под текстом — курсор в последнюю строку (или новую)
$("#app").addEventListener("mousedown", e => {
  if(!e.target.classList || !(e.target.classList.contains("ed-body") || e.target.classList.contains("ed-inner") || e.target.id === "blocks")) return;
  const n = note(); if(!n) return;
  e.preventDefault();
  const last = n.blocks[n.blocks.length - 1];
  if(last && last.text === "" && last.type === "text"){ focusBlock(last.id); return; }
  const nb = parseLine(""); n.blocks.push(nb); redraw(nb.id);
});
window.addEventListener("resize", () => document.querySelectorAll("#blocks textarea").forEach(autosize));

render();

if("serviceWorker" in navigator && location.protocol !== "file:"){
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
