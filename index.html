$("#app").addEventListener("focusin", e => { const b = e.target.closest && e.target.closest("#blocks .block"); if(b) lastFocus = b.dataset.b; });

$("#app").addEventListener("input", e => {
  const n = note(); if(!n) return;
  if(e.target.id === "title"){ n.title = e.target.value; touch(); refreshSide(); return; }
  const blk = e.target.closest(".block"); if(!blk) return;
  const i = n.blocks.findIndex(x => x.id === blk.dataset.b); if(i < 0) return;
  const b = n.blocks[i];
  if(e.target.type === "checkbox"){
    b.done = e.target.checked;
    if(b.habit){ b.hist = b.hist || {}; const k = iso(day0()); if(b.done) b.hist[k] = true; else delete b.hist[k]; }
    redraw(); if(b.done) hop(); return;
  }
  const val = e.target.value;
  if(val.includes("\n")){
    const lines = val.split(/\r?\n/);
    const first = parseLine(lines[0]);
    if(b.type === "text"){ b.type = first.type; b.done = first.done; }
    if(first.prio && !b.prio) b.prio = first.prio;
    b.text = first.text;
    const rest = lines.slice(1).map(parseLine);
    n.blocks.splice(i + 1, 0, ...rest);
    const last = rest[rest.length - 1];
    redraw(last.id, last.text.length); return;
  }
  if((b.type === "text" && CHECK_RE.test(val)) || (!b.prio && PRIO_RE.test(val))){
    const p = parseLine(val);
    if(p.type === "check" && b.type === "text"){ b.type = "check"; b.done = p.done; }
    if(p.prio && !b.prio) b.prio = p.prio;
    b.text = p.text;
    redraw(b.id, Math.max(0, e.target.selectionStart - (val.length - p.text.length))); return;
  }
  b.text = val; autosize(e.target); touch(); refreshSide();
  if(n.kind === "budget"){ const pnl = $("#budgetPanel"); if(pnl) pnl.outerHTML = budgetPanel(n); }
});

$("#app").addEventListener("keydown", e => {
  const n = note(); if(!n) return;
  if(e.target.id === "title" && (e.key === "Enter" || e.key === "ArrowDown")){
    e.preventDefault(); const j = editableNear(n, -1, 1);
    if(j >= 0) focusBlock(n.blocks[j].id, 0); else { const nb = parseLine(""); n.blocks.push(nb); redraw(nb.id); }
    return;
  }
  const blk = e.target.closest && e.target.closest(".block");
  if(!blk || e.target.tagName !== "TEXTAREA") return;
  const t = e.target, i = n.blocks.findIndex(x => x.id === blk.dataset.b), b = n.blocks[i];
  const start = t.selectionStart, endSel = t.selectionEnd, collapsed = start === endSel;

  if(e.key === "Enter"){
    e.preventDefault();
    if(b.type === "check" && t.value === ""){ b.type = "text"; b.done = false; redraw(b.id, 0); return; }
    const before = t.value.slice(0, start), after = t.value.slice(endSel);
    b.text = before;
    const nb = {id:uid(), type:b.type, text:after, done:false};
    n.blocks.splice(i + 1, 0, nb); redraw(nb.id, 0); return;
  }
  if(e.key === "Backspace" && collapsed && start === 0){
    if(b.prio){ e.preventDefault(); delete b.prio; redraw(b.id, 0); return; }
    if(b.type === "check"){ e.preventDefault(); b.type = "text"; b.done = false; redraw(b.id, 0); return; }
    const prev = n.blocks[i - 1];
    if(prev && prev.type !== "image"){
      e.preventDefault(); const pos = prev.text.length;
      prev.text += b.text; n.blocks.splice(i, 1); redraw(prev.id, pos); return;
    }
    // пустая строка сразу под картинкой — просто убрать строку
    if(prev && prev.type === "image" && b.text === "" && n.blocks.slice(i + 1).some(x => x.type !== "image")){
      e.preventDefault(); n.blocks.splice(i, 1); const j = editableNear(n, i - 1, 1); redraw(j >= 0 ? n.blocks[j].id : null, 0); return;
    }
  }
  if(e.key === "Delete" && collapsed && start === t.value.length){
    const next = n.blocks[i + 1];
    if(next && next.type !== "image"){ e.preventDefault(); b.text += next.text; n.blocks.splice(i + 1, 1); redraw(b.id, start); }
    return;
  }
  if(e.key === "ArrowUp" && collapsed && start === 0){
    e.preventDefault(); const j = editableNear(n, i, -1);
    j >= 0 ? focusBlock(n.blocks[j].id) : $("#title")?.focus(); return;
  }
  if(e.key === "ArrowDown" && collapsed && start === t.value.length){
    const j = editableNear(n, i, 1);
    if(j >= 0){ e.preventDefault(); focusBlock(n.blocks[j].id, 0); }
  }
});
