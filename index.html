<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Тетрадь заметок</title>
<meta name="theme-color" content="#3554d1">
<script>try{var t=localStorage.getItem("notes-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Literata:opsz,wght@7..72,500;7..72,600&display=swap">
<style>
/* Layout: три колонки — папки | заметки | редактор; на телефоне папки становятся вкладками, редактор открывается поверх списка */
:root{
  --bg:#f6f7f9; --panel:#ffffff; --line:#e3e6ec; --fg:#1d2330; --muted:#6b7385;
  --accent:#3554d1; --accent-soft:#e8ecfb; --done:#9aa1b0; --danger:#c0392b; --ok:#2e8b57;
  --red:#d64545; --yellow:#d9a514; --green:#3a9a5b;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-title:"Literata",Georgia,"Times New Roman",serif;
  --r:8px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14171e; --panel:#1b1f28; --line:#2b313d; --fg:#e6e9ef; --muted:#8e96a8;
  --accent:#8aa2ff; --accent-soft:#252d4a; --done:#5d6578; --danger:#ff7b6b; --ok:#5fcf8f; --red:#ff6b6b; --yellow:#f2c94c; --green:#5fcf8f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171e; --panel:#1b1f28; --line:#2b313d; --fg:#e6e9ef; --muted:#8e96a8;
  --accent:#8aa2ff; --accent-soft:#252d4a; --done:#5d6578; --danger:#ff7b6b; --ok:#5fcf8f; --red:#ff6b6b; --yellow:#f2c94c; --green:#5fcf8f; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.app{height:100%;display:grid;grid-template-columns:220px 280px minmax(0,1fr);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.col{min-width:0;display:flex;flex-direction:column;overflow:hidden}
.folders{border-right:1px solid var(--line);padding:20px 12px;gap:4px}
.list{border-right:1px solid var(--line);background:var(--panel)}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 8px 8px;display:flex;justify-content:space-between;align-items:center}
.folder{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:var(--r);text-align:left;width:100%}
.folder:hover{background:var(--accent-soft)}
.folder.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
.folder .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.folder .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.icon-btn{width:28px;height:28px;border-radius:6px;display:inline-grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--accent-soft);color:var(--accent)}
.list-head{display:flex;align-items:center;justify-content:space-between;padding:20px 16px 12px;gap:8px}
.list-head h2{margin:0;font-family:var(--f-title);font-size:20px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.notes{overflow-y:auto;flex:1;padding:0 8px 16px;display:flex;flex-direction:column;gap:2px}
.note{text-align:left;padding:10px;border-radius:var(--r);width:100%}
.note:hover{background:var(--bg)}
.note.on{background:var(--accent-soft)}
.note b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note span{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:var(--muted);padding:12px 10px;font-size:14px}
.editor{background:var(--panel)}
.ed-bar{display:flex;align-items:center;gap:6px;padding:14px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ed-bar .sp{flex:1}
.chip{padding:6px 10px;border-radius:6px;border:1px solid var(--line);font-size:13px}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.chip.primary:hover{color:var(--panel);opacity:.9}
.chip.danger:hover{border-color:var(--danger);color:var(--danger)}
.back{display:none}
.ed-body{overflow-y:auto;flex:1;padding:28px 32px 80px}
.ed-inner{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.title{font-family:var(--f-title);font-size:28px;font-weight:600;border:0;background:none;color:var(--fg);width:100%;padding:0;margin-bottom:6px}
.title::placeholder{color:var(--done)}
.meta{font-size:12px;color:var(--muted);margin-bottom:14px}
.block{display:flex;align-items:flex-start;gap:10px}
.block textarea{flex:1;min-width:0;border:0;background:none;color:var(--fg);font:inherit;resize:none;padding:2px 0;overflow:hidden;line-height:1.55}
.block textarea::placeholder{color:var(--done)}
.block.check input{appearance:none;-webkit-appearance:none;width:18px;height:18px;margin:4px 0 0;flex:none;border:1.5px solid var(--muted);border-radius:5px;display:grid;place-items:center;cursor:pointer}
.block.check input:checked{background:var(--accent);border-color:var(--accent)}
.block.check input:checked::after{content:"";width:5px;height:9px;border:solid var(--panel);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.block.check.done textarea{color:var(--done);text-decoration:line-through}
.block .del{opacity:0;width:24px;height:24px;border-radius:5px;color:var(--muted);flex:none}
.block:hover .del,.block:focus-within .del{opacity:1}
.del:hover{background:var(--accent-soft)}
.progress{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.placeholder{flex:1;display:grid;place-items:center;color:var(--muted);text-align:center;padding:24px}
.inline-input{width:100%;padding:7px 8px;border:1px solid var(--accent);border-radius:var(--r);background:var(--panel);color:var(--fg);font:inherit}
.foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:8px}
.sync{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);text-align:left;padding:6px 8px;border-radius:var(--r)}
.sync:hover{background:var(--accent-soft)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--done);flex:none}
.dot.ok{background:var(--ok)} .dot.busy{background:var(--accent)} .dot.err{background:var(--danger)}
.confirm{display:flex;gap:6px;align-items:center;font-size:13px}

/* Окно аккаунта */
.sheet{position:fixed;inset:0;background:rgba(10,14,25,.45);display:grid;place-items:center;padding:16px;z-index:10}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:100%;max-width:400px;padding:22px;display:flex;flex-direction:column;gap:12px;max-height:100%;overflow-y:auto}
.card h3{margin:0;font-family:var(--f-title);font-size:20px}
.card p{margin:0;color:var(--muted);font-size:14px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.field input{padding:9px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);color:var(--fg);font:inherit}
.row{display:flex;gap:8px;flex-wrap:wrap}
.msg{font-size:13px;min-height:1em}
.msg.err{color:var(--danger)} .msg.ok{color:var(--ok)}
hr{border:0;border-top:1px solid var(--line);margin:4px 0}

@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);
    padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
  .folders{border:0;flex-direction:row;overflow-x:auto;padding:12px 0;gap:6px;align-items:center}
  .folders .label{display:none}
  .foot{margin:0;padding:0;flex:none;order:99;flex-direction:row;align-items:center}
  .mascot{width:auto;padding:2px 4px}
  .mascot .m-name{display:none}
  .folders .mascot-svg{width:34px;height:34px}
  .mascot .bubble{left:auto;right:0;top:38px;z-index:5}
  .sync span:last-child{display:none}
  .folder{width:auto;flex:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px}
  .folder.on{border-color:var(--accent)}
  .add-folder-m{display:inline-grid!important;flex:none}
  .list,.editor{border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px}
  .editor{grid-row:2}
  .app.reading .list{display:none}
  .app:not(.reading) .editor{display:none}
  .back{display:inline-block}
  .ed-body{padding:20px 16px 60px}
  .block .del{opacity:1}
}
.add-folder-m{display:none!important}
@media (prefers-reduced-motion:no-preference){.folder,.note,.chip{transition:background .12s,border-color .12s,color .12s}}
/* Папки и треды внутри них */
.folder.open:not(.on){font-weight:500}
.folder.sub{padding:5px 8px 5px 22px;font-size:14px}
.folder .hash{color:var(--muted);flex:none}
.folder.on .hash{color:var(--accent)}
.folder.add-thread{color:var(--muted);font-size:13px}
.sub-wrap{padding-left:14px}
.list-head .hd{min-width:0;display:flex;flex-direction:column}
.crumb{font-size:12px;color:var(--muted);text-align:left;padding:0;align-self:flex-start}
.crumb:hover{color:var(--accent)}
.list-actions{display:flex;gap:6px;padding:0 16px 10px}
.list-actions .chip{flex:1}
.sec{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 10px 4px}
.note.thread-row b{color:var(--accent)}

/* Поиск и метки */
.search{display:flex;gap:6px;padding:14px 16px 0}
.search input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);color:var(--fg);font:inherit;font-size:14px}
.search input::placeholder{color:var(--done)}
.chip.urgent{display:flex;align-items:center;gap:6px;flex:none}
.chip.urgent.on{border-color:var(--red);color:var(--red)}
.list-inner{flex:1;min-height:0;display:flex;flex-direction:column}
.pdot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none;background:var(--done)}
.pdot.red{background:var(--red)} .pdot.yellow{background:var(--yellow)} .pdot.green{background:var(--green)}
.note span.pdot{display:inline-block;overflow:visible}
.note b .pdot{margin-right:7px;vertical-align:1px}
.note .where{font-size:12px;color:var(--muted)}
.note .hot{display:block;font-size:13px;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note .hot .pdot{width:7px;height:7px;margin-right:6px;vertical-align:1px}
mark{background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:0 1px}
.block .pb{width:14px;height:26px;display:grid;place-items:center;flex:none;padding:0;margin-right:-4px}
.block .pb:hover .pdot{transform:scale(1.3)}
.block.p-red textarea{font-weight:500}
.prio-pick{display:flex;align-items:center;gap:2px;padding:0 4px;border:1px solid var(--line);border-radius:6px;height:31px}
.prio-pick button{width:24px;height:24px;border-radius:5px;display:grid;place-items:center}
.prio-pick button:hover{background:var(--accent-soft)}
.prio-pick button.on{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--fg)}
.prio-pick .lbl{font-size:12px;color:var(--muted);padding:0 4px}

/* Закрепление, даты, «Сегодня» */
.note span.pin{display:inline;margin-right:5px;font-size:11px}
.dtag{font-size:12px;color:var(--muted);white-space:nowrap;padding-top:4px;flex:none}
.dtag.today{color:var(--yellow);font-weight:500} .dtag.late{color:var(--red)} .dtag.soon{color:var(--accent)}
.block.done .dtag{color:var(--done)}
.chip.today-btn{flex:none;display:flex;align-items:center;gap:5px}
.chip.today-btn.on{border-color:var(--accent);color:var(--accent)}
.chip.today-btn .cnt{font-variant-numeric:tabular-nums}
.note .line{display:flex;align-items:baseline;gap:6px;font-size:14px;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note .line .lt{min-width:0;overflow:hidden;text-overflow:ellipsis}
.note .line .lbox{width:11px;height:11px;border:1.5px solid var(--muted);border-radius:3px;flex:none;align-self:center}
.theme-btn .ti{width:12px;display:grid;place-items:center;font-size:13px;margin-left:-2px}

/* Привычки */
.htag{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap;padding-top:4px;flex:none}
.htag .fire{color:var(--yellow);font-weight:600;font-variant-numeric:tabular-nums}
.hdots{display:flex;gap:3px}
.hdots i{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--done)}
.hdots i.y{background:var(--accent);border-color:var(--accent)}
.hdots i.off{border:0;background:var(--line);width:5px;height:5px;margin:1px}
.hdots i.t{box-shadow:0 0 0 1.5px var(--panel),0 0 0 3px var(--accent-soft)}

/* Маскоты: Клубничка и Малинка */
.mascot{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:var(--r);position:relative;text-align:left;width:100%}
.mascot:hover{background:var(--accent-soft)}
.mascot .m-name{font-size:12px;color:var(--muted);line-height:1.3}
.mascot .m-name b{display:block;color:var(--fg);font-weight:500;font-size:13px}
.mascot-svg{display:block;flex:none;overflow:visible}
.mascot-svg.hop{animation:hop .55s ease}
.mascot .bubble{position:absolute;left:52px;top:-6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px 9px;font-size:12px;white-space:nowrap;box-shadow:0 4px 12px rgba(10,14,25,.12);pointer-events:none}
@keyframes hop{0%,100%{transform:translateY(0)}35%{transform:translateY(-9px) rotate(-5deg)}65%{transform:translateY(0) rotate(4deg)}}
@media (prefers-reduced-motion:reduce){.mascot-svg.hop{animation:none}}
.ph-in{display:flex;flex-direction:column;align-items:center;gap:12px}

/* Корзина */
.trash-btn.on{background:var(--accent-soft);color:var(--accent)}
.trash-btn .ti{width:8px;display:grid;place-items:center;font-size:11px;filter:grayscale(1)}
.note.trash-row{display:flex;align-items:center;gap:10px;cursor:default}
.note.trash-row:hover{background:none}
.trash-row .tr-txt{flex:1;min-width:0}

/* Бюджет */
.chip.on-acc{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.budget{border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;margin-bottom:14px;background:var(--bg)}
.budget .bl{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.budget .bv{display:block;font-family:var(--f-title);font-size:32px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.budget .bs{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.budget .neg{color:var(--red)}
.bg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.bg-grid b{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.nw{white-space:nowrap}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:3px}
.bg-next{font-size:13px}
.bg-next.late{color:var(--red)}
.plan{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.plan table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.plan td{padding:5px 0;vertical-align:top;border-bottom:1px solid var(--line)}
.plan tr:last-child td{border-bottom:0}
.plan td:nth-child(2){text-align:right;white-space:nowrap;padding-left:10px}
.plan td:nth-child(3){text-align:right;color:var(--muted);width:56px;white-space:nowrap;padding-left:8px}
.plan .pn{display:block;font-size:12px;color:var(--muted);white-space:normal}
.plan tr.inc td{font-weight:600}
.plan tr.inc .pn{font-weight:400}
.plan tr.tot td{font-weight:600;color:var(--ok)}
.plan tr.tot.neg td, .plan .neg{color:var(--red)}
.bg-note{font-size:13px}
.bg-note.warn{color:var(--red)}
.bg-note a{color:var(--accent)}
.bg-note code,.goal .pn code{font-family:inherit;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:0 4px;white-space:nowrap}
.bg-help{font-size:12px;color:var(--muted);line-height:1.5}
.bg-help code{font-family:inherit;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:0 4px;white-space:nowrap}
.due{font-size:12px;color:var(--muted);white-space:nowrap;padding-top:4px;flex:none;font-variant-numeric:tabular-nums}
.due.late{color:var(--red)} .due.soon{color:var(--yellow)} .due.paid{color:var(--ok)}
/* Траты и цели */
.bg-today{font-size:13px}
.bg-today.neg{color:var(--red)}
.goal{display:flex;flex-direction:column;gap:5px;padding:8px 0;border-bottom:1px solid var(--line)}
.goal:last-of-type{border-bottom:0}
.g-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px}
.g-top b{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-top span{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted);font-size:13px}
.goal .pn{font-size:12px;color:var(--muted)}
.goal .pn.neg{color:var(--red)}
.goal.reached .bar i{background:var(--accent)}

/* Картинки */
.block.image{display:block;position:relative;margin:6px 0}
.block.image img{display:block;max-width:100%;max-height:420px;border-radius:var(--r);border:1px solid var(--line);cursor:zoom-in;background:var(--bg)}
.block.image .img-ph{display:grid;place-items:center;width:100%;max-width:320px;aspect-ratio:4/3;border-radius:var(--r);border:1px dashed var(--line);color:var(--muted);font-size:13px;text-align:center;padding:12px}
.block.image .del{position:absolute;top:8px;left:8px;opacity:0;background:var(--panel);border:1px solid var(--line);width:28px;height:28px}
.block.image:hover .del,.block.image:focus-within .del{opacity:1}
.block.image .up{position:absolute;bottom:8px;left:8px;font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--muted)}
.ed-body.drop{outline:2px dashed var(--accent);outline-offset:-10px}
.viewer{position:fixed;inset:0;z-index:30;background:rgba(5,8,15,.88);display:grid;place-items:center;padding:16px;cursor:zoom-out}
.viewer img{max-width:100%;max-height:100%;border-radius:6px}
@media (max-width:820px){
  .folder.sub{padding:5px 12px;font-size:13px;border-style:dashed}
  .folder.add-thread{display:none}
  .folders .inline-input{flex:none;width:180px}
  .sub-wrap{padding:0;flex:none}
  .block.image .del{opacity:1}
}
</style>
</head>
<body>
<div class="app" id="app">
  <nav class="col folders" id="folders" aria-label="Папки и треды"></nav>
  <section class="col list" id="list">
    <div class="search"><input id="q" type="search" placeholder="Поиск" aria-label="Поиск по всем заметкам" autocomplete="off"><button class="chip today-btn" id="todayBtn" title="Дела на сегодня и неделю">Сегодня <span class="cnt" id="todayN"></span></button><button class="chip urgent" id="urgentBtn" title="Срочное и скоро"><span class="pdot red"></span><span id="urgentN">0</span></button></div>
    <div class="list-inner" id="listBody"></div>
  </section>
  <section class="col editor" id="editor"></section>
</div>
<div class="viewer" id="viewer" hidden><img alt=""></div>
<input type="file" id="imgFile" accept="image/*" multiple hidden>
<div class="sheet" id="sheet" hidden>
  <div class="card" role="dialog" aria-labelledby="sheetTitle">
    <h3 id="sheetTitle">Синхронизация</h3>
    <div id="sheetBody"></div>
    <hr>
    <p>Резервная копия всех заметок в файл:</p>
    <div class="row">
      <button class="chip" id="exportBtn">Скачать копию</button>
      <button class="chip" id="importBtn">Загрузить из файла</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
    <div class="msg" id="backupMsg"></div>
    <div class="row" style="justify-content:flex-end"><button class="chip" id="closeSheet">Закрыть</button></div>
  </div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
"use strict";
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const LS = "notes-pwa-v1";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ================= Данные: Папка → заметки и треды → заметки треда ================= */
function sample(){
  const now = Date.now();
  const b = (type, text, done=false) => ({id:uid(), type, text, done});
  return {
    folders:[
      {id:"f1",name:"Личное",updated:now,threads:[],notes:[
        {id:"n1",title:"Пример: покупки на выходные",updated:now,blocks:[b("check","Молоко",true),b("check","Хлеб"),b("check","Яблоки, 1 кг"),b("text","Заодно заглянуть в аптеку.")]}]},
      {id:"f2",name:"Пример: игра",updated:now,notes:[],threads:[
        {id:"t1",name:"Прохождение",updated:now,notes:[
          {id:"n2",title:"Пример: боссы",updated:now-3600000,blocks:[b("check","Первый босс",true),b("check","Второй босс")]}]}]}
    ],
    deleted:{},
    cur:{folder:"f1", thread:null, note:"n1"}
  };
}
function normalize(s){
  if(!s) return null;
  // прошлая схема «Тред → Папки»: тред становится папкой, его папки — тредами
  if(Array.isArray(s.threads)){
    const folders = [];
    for(const t of s.threads){
      if(t.id === "t-main") folders.push(...(t.folders || []).map(f => ({...f, threads:[]})));
      else folders.push({id:t.id, name:t.name, updated:t.updated || 0, notes:[],
        threads:(t.folders || []).map(f => ({id:f.id, name:f.name, updated:f.updated || 0, notes:f.notes || []}))});
    }
    s = {folders, deleted:s.deleted || {}, cur:{}};
  }
  if(!Array.isArray(s.folders)) return null;
  s.deleted = s.deleted || {};
  s.trash = Array.isArray(s.trash) ? s.trash : [];
  s.cur = s.cur || {};
  const fixNotes = ns => (ns || []).map(n => ({...n, blocks:n.blocks || [], updated:n.updated || 0}));
  s.folders = s.folders.map(f => ({...f, updated:f.updated || 0, notes:fixNotes(f.notes),
    threads:(f.threads || []).map(t => ({...t, updated:t.updated || 0, notes:fixNotes(t.notes)}))}));
  return s;
}
let state;
try{ state = normalize(JSON.parse(localStorage.getItem(LS))); }catch(e){}
if(!state) state = sample();

let storageFull = false;
function saveLocal(){
  try{ localStorage.setItem(LS, JSON.stringify(state)); storageFull = false; }
  catch(e){ storageFull = true; }
  renderSync();
}
function changed(){ saveLocal(); scheduleSync(); }

/* Слияние двух версий: по каждой папке, треду и заметке побеждает более свежая правка, удаления запоминаются */
function mergeNodes(A, B, deleted, kids = {}){
  const ma = new Map(A.map(x => [x.id, x])), mb = new Map(B.map(x => [x.id, x]));
  const order = [...A.map(x => x.id), ...B.map(x => x.id).filter(id => !ma.has(id))];
  const out = [];
  for(const id of order){
    const x = ma.get(id), y = mb.get(id);
    const newer = !x ? y : !y ? x : ((y.updated||0) > (x.updated||0) ? y : x);
    if(deleted[id] >= (newer.updated||0)) continue;
    const node = {...newer};
    for(const [k, fn] of Object.entries(kids)) node[k] = fn(x ? x[k] || [] : [], y ? y[k] || [] : []);
    out.push(node);
  }
  return out;
}
function merge(a, b){
  const deleted = {...(a.deleted||{})};
  for(const [k,v] of Object.entries(b.deleted||{})) deleted[k] = Math.max(deleted[k]||0, v);
  const notesM = (na, nb) => mergeNodes(na, nb, deleted);
  const folders = mergeNodes(a.folders, b.folders, deleted, {
    notes: notesM,
    threads: (ta, tb) => mergeNodes(ta, tb, deleted, {notes: notesM})
  });
  const month = Date.now() - 30*864e5;
  for(const k of Object.keys(deleted)) if(deleted[k] < month) delete deleted[k];
  // корзина: объединяем, убираем восстановленное и записи старше 30 дней
  const alive = new Set();
  folders.forEach(f => { alive.add(f.id); f.notes.forEach(n => alive.add(n.id)); f.threads.forEach(t => { alive.add(t.id); t.notes.forEach(n => alive.add(n.id)); }); });
  const tm = new Map();
  for(const e of [...(a.trash || []), ...(b.trash || [])]) if(!tm.has(e.id) || tm.get(e.id).at < e.at) tm.set(e.id, e);
  const trash = [...tm.values()].filter(e => !alive.has(e.id) && e.at > month).sort((x, y) => y.at - x.at);
  return {folders, deleted, trash, cur:a.cur};
}
const strip = s => JSON.stringify({folders:s.folders, deleted:s.deleted, trash:s.trash});

/* ================= Синхронизация ================= */
const CFG = window.NOTES_CONFIG || {};
const cloudConfigured = !!(CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY && window.supabase);
let sb = null, session = null;
let sync = {state: cloudConfigured ? "signedout" : "local", at: null, error: ""};
let syncTimer = null, syncing = false, again = false;

if(cloudConfigured){
  sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, {auth:{persistSession:true, autoRefreshToken:true}});
}

function setSync(st, err=""){ sync.state = st; sync.error = err; if(st === "ok") sync.at = Date.now(); renderSync(); if(!$("#sheet").hidden) renderSheet(); }
function scheduleSync(delay=1200){ if(!session) return; clearTimeout(syncTimer); syncTimer = setTimeout(doSync, delay); }

function allNotes(s = state){ return s.folders.flatMap(f => [...f.notes, ...f.threads.flatMap(t => t.notes)]); }

/* Картинки, добавленные без сети или до входа, сначала отправляются в хранилище */
async function uploadPending(){
  for(const n of allNotes()){
    for(const b of n.blocks){
      if(b.type !== "image" || !b.data) continue;
      const blob = await (await fetch(b.data)).blob();
      const path = `${session.user.id}/${b.id}.jpg`;
      const {error} = await sb.storage.from("images").upload(path, blob, {contentType:"image/jpeg", upsert:true});
      if(error) throw new Error("Картинка не загрузилась: " + error.message);
      b.path = path; urlCache[path] = {url:b.data, exp:Date.now() + 3600e3}; delete b.data;
      n.updated = Date.now(); saveLocal();
    }
  }
}

async function doSync(){
  if(!sb || !session) return;
  if(syncing){ again = true; return; }
  if(!navigator.onLine){ setSync("offline"); return; }
  syncing = true; setSync("busy");
  try{
    await uploadPending();
    const {data, error} = await sb.from("notes_state").select("data").eq("user_id", session.user.id).maybeSingle();
    if(error) throw error;
    const remote = data && normalize(data.data);
    const before = strip(state);
    const merged = remote ? merge(state, remote) : state;
    if(!remote || strip(merged) !== strip(remote)){
      const {error: e2} = await sb.from("notes_state").upsert({user_id: session.user.id, data: {folders:merged.folders, deleted:merged.deleted, trash:merged.trash}, updated_at: new Date().toISOString()});
      if(e2) throw e2;
    }
    if(strip(merged) !== before) applyRemote(merged);
    setSync("ok");
  }catch(e){
    setSync(navigator.onLine ? "error" : "offline", e && e.message ? e.message : String(e));
  }finally{
    syncing = false;
    if(again){ again = false; scheduleSync(300); }
  }
}

function fixCur(){
  if(!state.folders.find(f => f.id === state.cur.folder)) state.cur.folder = state.folders[0]?.id || null;
  const f = folder();
  if(state.cur.thread && !(f && f.threads.find(t => t.id === state.cur.thread))) state.cur.thread = null;
  if(!note()) state.cur.note = null;
}
/* Применить пришедшие изменения, не сбивая курсор, если открытая заметка не поменялась */
function applyRemote(merged){
  const curBefore = JSON.stringify(note() || null);
  state.folders = merged.folders; state.deleted = merged.deleted; state.trash = merged.trash;
  fixCur(); saveLocal();
  const editing = document.activeElement && $("#editor").contains(document.activeElement);
  if(editing && JSON.stringify(note() || null) === curBefore){ renderFolders(); renderList(); }
  else render();
}

if(sb){
  sb.auth.onAuthStateChange((_ev, s) => {
    const was = session; session = s;
    if(s && !was){ doSync(); renderEditor(); }
    if(!s) setSync("signedout");
  });
}
window.addEventListener("online", () => scheduleSync(200));
window.addEventListener("offline", () => session && setSync("offline"));
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") scheduleSync(200); });
setInterval(() => { if(document.visibilityState === "visible") scheduleSync(0); }, 60000);

function syncLabel(){
  if(storageFull) return "Память устройства заполнена";
  const t = sync.at ? new Date(sync.at).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"}) : "";
  return {
    local:"Только на этом устройстве",
    signedout:"Войдите для синхронизации",
    busy:"Синхронизирую…",
    ok:"Синхронизировано " + t,
    offline:"Нет сети, сохранено на устройстве",
    error:"Ошибка синхронизации"
  }[sync.state];
}
function dotClass(){ return storageFull ? "err" : ({ok:"ok",busy:"busy",error:"err"}[sync.state] || ""); }
function renderSync(){
  const el = $("#syncBtn"); if(!el) return;
  el.innerHTML = `<span class="dot ${dotClass()}"></span><span>${esc(syncLabel())}</span>`;
  el.title = syncLabel();
}

/* ================= Картинки ================= */
let urlCache = {};
try{ urlCache = JSON.parse(localStorage.getItem("notes-img-urls")) || {}; }catch(e){}
function saveUrlCache(){
  const now = Date.now();
  for(const k of Object.keys(urlCache)) if(urlCache[k].exp < now || urlCache[k].url.startsWith("data:")) delete urlCache[k];
  try{ localStorage.setItem("notes-img-urls", JSON.stringify(urlCache)); }catch(e){}
}
async function imageUrl(path){
  const c = urlCache[path];
  if(c && c.exp > Date.now() + 864e5) return c.url;
  if(!sb || !session) return null;
  const {data, error} = await sb.storage.from("images").createSignedUrl(path, 7*864e5/1000);
  if(error || !data) return null;
  urlCache[path] = {url:data.signedUrl, exp:Date.now() + 7*864e5}; saveUrlCache();
  return data.signedUrl;
}
function hydrateImages(){
  document.querySelectorAll("#blocks .block.image[data-path]").forEach(async el => {
    const path = el.dataset.path, url = await imageUrl(path);
    const holder = el.querySelector(".img-ph");
    if(!holder) return;
    if(url){ holder.outerHTML = `<img src="${esc(url)}" alt="">`; }
    else holder.textContent = session ? "Картинка не загрузилась" : "Войдите, чтобы увидеть картинку";
  });
}
/* Сжатие: до 1600 пикселей по длинной стороне, JPEG ~80% */
function compress(file){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
      g.drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg", 0.8));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("bad image")); };
    img.src = url;
  });
}
async function addImages(files){
  const n = note(); if(!n) return;
  const imgs = [...files].filter(f => f.type.startsWith("image/")); if(!imgs.length) return;
  let i = n.blocks.findIndex(b => b.id === lastFocus);
  if(i < 0) i = n.blocks.length - 1;
  const added = [];
  for(const f of imgs){
    try{ added.push({id:uid(), type:"image", data: await compress(f)}); }catch(e){}
  }
  if(!added.length) return;
  n.blocks.splice(i + 1, 0, ...added);
  const after = n.blocks[i + 1 + added.length];
  let focusId = after && after.type !== "image" ? after.id : null;
  if(!focusId){ const nb = {id:uid(), type:"text", text:"", done:false}; n.blocks.splice(i + 1 + added.length, 0, nb); focusId = nb.id; }
  redraw(focusId, 0);
}
function openViewer(src){ const v = $("#viewer"); v.querySelector("img").src = src; v.hidden = false; }
$("#viewer").addEventListener("click", () => { $("#viewer").hidden = true; });
$("#imgFile").addEventListener("change", e => { addImages(e.target.files); e.target.value = ""; });

/* ================= Окно аккаунта ================= */
function openSheet(){ $("#sheet").hidden = false; $("#backupMsg").textContent = ""; renderSheet(); }
function renderSheet(){
  const b = $("#sheetBody");
  if(!cloudConfigured){
    b.innerHTML = `<p>Синхронизация не настроена. Заметки хранятся только на этом устройстве. Чтобы включить её, заполните файл config.js по инструкции.</p>`;
    return;
  }
  if(session){
    b.innerHTML = `<p>Вы вошли как <b>${esc(session.user.email)}</b>.</p>
      <p style="margin-top:8px">${esc(syncLabel())}${sync.error ? ": " + esc(sync.error) : ""}</p>
      <div class="row" style="margin-top:12px"><button class="chip primary" id="syncNow">Синхронизировать</button><button class="chip" id="signOut">Выйти</button></div>`;
    return;
  }
  if(b.querySelector("#email")) return;
  b.innerHTML = `<form id="authForm" style="display:flex;flex-direction:column;gap:10px">
      <p>Войдите под одним аккаунтом на всех устройствах, и заметки будут общими.</p>
      <label class="field">Почта<input id="email" type="email" autocomplete="email" required></label>
      <label class="field">Пароль, не короче 6 символов<input id="password" type="password" autocomplete="current-password" minlength="6" required></label>
      <div class="row"><button class="chip primary" type="submit" id="signIn">Войти</button><button class="chip" type="button" id="signUp">Создать аккаунт</button></div>
      <div class="msg" id="authMsg"></div></form>`;
}
async function auth(kind){
  const email = $("#email").value.trim(), password = $("#password").value, msg = $("#authMsg");
  if(!email || password.length < 6){ msg.className = "msg err"; msg.textContent = "Введите почту и пароль не короче 6 символов."; return; }
  msg.className = "msg"; msg.textContent = kind === "in" ? "Вхожу…" : "Создаю аккаунт…";
  const {data, error} = kind === "in"
    ? await sb.auth.signInWithPassword({email, password})
    : await sb.auth.signUp({email, password});
  if(error){
    msg.className = "msg err";
    msg.textContent = /Invalid login/i.test(error.message) ? "Неверная почта или пароль."
      : /already registered/i.test(error.message) ? "Такой аккаунт уже есть, нажмите «Войти»."
      : /not confirmed/i.test(error.message) ? "Почта не подтверждена. Откройте письмо от Supabase и перейдите по ссылке."
      : /signups not allowed/i.test(error.message) ? "Регистрация новых аккаунтов выключена."
      : error.message;
    return;
  }
  if(kind === "up" && !data.session){ msg.className = "msg ok"; msg.textContent = "Аккаунт создан. Подтвердите почту по ссылке из письма, затем войдите."; return; }
  renderSheet();
}
$("#sheet").addEventListener("submit", e => { if(e.target.id === "authForm"){ e.preventDefault(); auth("in"); } });
$("#sheet").addEventListener("click", async e => {
  const id = e.target.id;
  if(e.target === $("#sheet") || id === "closeSheet") $("#sheet").hidden = true;
  if(id === "signUp") auth("up");
  if(id === "signOut"){ await sb.auth.signOut(); renderSheet(); }
  if(id === "syncNow") doSync();
  if(id === "exportBtn") exportBackup();
  if(id === "importBtn") $("#importFile").click();
});
document.addEventListener("keydown", e => {
  if(e.key !== "Escape") return;
  $("#sheet").hidden = true; $("#viewer").hidden = true; closeMenu();
});

function exportBackup(){
  const blob = new Blob([JSON.stringify({folders:state.folders, deleted:state.deleted}, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "заметки-" + new Date().toISOString().slice(0,10) + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  $("#backupMsg").className = "msg ok"; $("#backupMsg").textContent = "Файл сохранён в загрузки. Картинки из облака в него не входят.";
}
$("#importFile").addEventListener("change", async e => {
  const f = e.target.files[0]; if(!f) return;
  const m = $("#backupMsg");
  try{
    const s = normalize(JSON.parse(await f.text()));
    if(!s) throw new Error();
    const merged = merge(state, s);
    state.folders = merged.folders; state.deleted = merged.deleted; state.trash = merged.trash;
    fixCur(); changed(); render();
    m.className = "msg ok"; m.textContent = "Заметки из файла добавлены.";
  }catch(err){ m.className = "msg err"; m.textContent = "Это не файл копии заметок."; }
  e.target.value = "";
});

/* ================= Интерфейс ================= */
let reading = false, editing = null, confirmDel = null, lastFocus = null;
let view = null, query = "";   // view: "urgent" — экран «Срочное»; query — строка поиска
const PRIO_RANK = {red:3, yellow:2, green:1};
const PRIO_NEXT = {red:"yellow", yellow:"green", green:null};
/* Самая сильная метка заметки: своя или любой незакрытой строки */
function notePrio(n){
  let best = n.prio || null;
  for(const b of n.blocks) if(b.prio && !(b.type === "check" && b.done) && (PRIO_RANK[b.prio] > (PRIO_RANK[best] || 0))) best = b.prio;
  return best;
}
function everyNote(){
  const out = [];
  for(const f of state.folders){
    f.notes.forEach(n => out.push({n, f, t:null}));
    f.threads.forEach(t => t.notes.forEach(n => out.push({n, f, t})));
  }
  return out;
}
const whereOf = x => esc(x.f.name) + (x.t ? " › # " + esc(x.t.name) : "");
function hl(text, q){
  if(!q) return esc(text);
  const low = text.toLowerCase(), ql = q.toLowerCase(); let i = 0, out = "", j;
  while((j = low.indexOf(ql, i)) >= 0){ out += esc(text.slice(i, j)) + "<mark>" + esc(text.slice(j, j + q.length)) + "</mark>"; i = j + q.length; }
  return out + esc(text.slice(i));
}
function urgentLists(){
  const red = [], yellow = [];
  for(const x of everyNote()){ const p = notePrio(x.n); if(p === "red") red.push(x); else if(p === "yellow") yellow.push(x); }
  const by = (a, b) => b.n.updated - a.n.updated;
  return {red:red.sort(by), yellow:yellow.sort(by)};
}
function renderResults(){
  const el = $("#listBody");
  const item = (x, extra) => `<button class="note ${x.n.id===state.cur.note?"on":""}" data-go="${x.n.id}"><b>${notePrio(x.n) ? `<span class="pdot ${notePrio(x.n)}"></span>` : ""}${hl(x.n.title || "Без названия", view ? "" : query.trim())}</b><span class="where">${whereOf(x)}</span>${extra}</button>`;
  if(view === "urgent"){
    const {red, yellow} = urgentLists();
    const hot = n => n.blocks.filter(b => b.prio && b.text.trim() && !(b.type === "check" && b.done) && b.prio !== "green")
      .sort((a, b) => PRIO_RANK[b.prio] - PRIO_RANK[a.prio]).slice(0, 3)
      .map(b => `<span class="hot"><span class="pdot ${b.prio}"></span>${esc(b.text)}</span>`).join("");
    const sec = (title, arr) => arr.length ? `<div class="sec">${title}</div>` + arr.map(x => item(x, hot(x.n))).join("") : "";
    el.innerHTML = `<div class="list-head"><div class="hd"><h2>Срочное</h2></div><button class="icon-btn" id="closeView" title="Закрыть" aria-label="Закрыть">✕</button></div>
      <div class="notes">${red.length || yellow.length ? sec("Срочно", red) + sec("Скоро", yellow)
        : `<div class="empty">Здесь появятся заметки и строки с красной и жёлтой меткой. Начните строку с «!! » — она станет срочной, с «! » — жёлтой, с «~ » — зелёной.</div>`}</div>`;
    return;
  }
  const q = query.trim().toLowerCase();
  const found = [];
  for(const x of everyNote()){
    const inTitle = (x.n.title || "").toLowerCase().includes(q);
    const line = x.n.blocks.find(b => b.type !== "image" && b.text.toLowerCase().includes(q));
    if(inTitle || line) found.push({x, line});
  }
  found.sort((a, b) => b.x.n.updated - a.x.n.updated);
  el.innerHTML = `<div class="list-head"><div class="hd"><h2>Найдено: ${found.length}</h2></div></div>
    <div class="notes">${found.length ? found.slice(0, 100).map(r => item(r.x, r.line ? `<span class="hot">${hl(r.line.text, query.trim())}</span>` : "")).join("")
      : `<div class="empty">Ничего не нашлось. Поиск идёт по названиям и тексту всех заметок во всех папках.</div>`}</div>`;
}
function updateUrgentBtn(){
  const tc = todayCount();
  $("#todayN").textContent = tc ? tc : "";
  $("#todayBtn").classList.toggle("on", view === "today");
  const {red} = urgentLists();
  $("#urgentN").textContent = red.length;

const folder = () => state.folders.find(f => f.id === state.cur.folder) || state.folders[0];
const thread = () => { const f = folder(); return f && state.cur.thread ? f.threads.find(t => t.id === state.cur.thread) || null : null; };
const place = () => thread() || folder();   // где лежат заметки, открытые сейчас
const note = () => { const p = place(); return p && p.notes.find(n => n.id === state.cur.note); };
const folderCount = f => f.notes.length + f.threads.reduce((s, t) => s + t.notes.length, 0);

function when(t){
  const d = new Date(t), now = new Date();
  return d.toDateString() === now.toDateString()
    ? d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})
    : d.toLocaleDateString("ru-RU",{day:"numeric",month:"short"});
}
function preview(n){
  if(n.kind === "budget"){ const B = budgetOf(n); if(B.free != null) return when(n.updated) + " · Свободно " + rub(B.free); if(B.pays.length) return when(n.updated) + " · Ещё заплатить " + rub(B.unpaid); }
  const checks = n.blocks.filter(b => b.type === "check");
  const first = n.blocks.find(b => b.type !== "image" && b.text.trim());
  const imgs = n.blocks.filter(b => b.type === "image").length;
  const p = checks.length ? `${checks.filter(b=>b.done).length}/${checks.length} · ` : "";
  return when(n.updated) + " · " + p + (first ? first.text : imgs ? "Картинка" : "Пусто");

/* ================= Даты у строк =================
   «@сегодня», «@завтра», «@пт», «@20.10», «@20 окт», «@5» (число месяца). Дата фиксируется, когда её написали. */
const WD = ["вс","пн","вт","ср","чт","пт","сб"];
const MON = ["янв","фев","мар","апр","ма","июн","июл","авг","сен","окт","ноя","дек"];
const DATE_RE = /(?:^|\s)@(сегодня|завтра|послезавтра|пн|вт|ср|чт|пт|сб|вс|\d{1,2}\.\d{1,2}(?:\.\d{2,4})?|\d{1,2}(?:\s+(?:янв|фев|мар|апр|ма[яй]|июн|июл|авг|сен|окт|ноя|дек)[а-я]*)?)(?=$|[\s,.;!?)])/i;
const iso = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const day0 = (d = new Date()) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const fromIso = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const dayDiff = s => Math.round((fromIso(s) - day0()) / 864e5);
function resolveDate(tok){
  const t = tok.toLowerCase(), now = day0(), add = k => new Date(now.getFullYear(), now.getMonth(), now.getDate() + k);
  if(t === "сегодня") return now;
  if(t === "завтра") return add(1);
  if(t === "послезавтра") return add(2);
  const w = WD.indexOf(t);
  if(w >= 0) return add((w - now.getDay() + 7) % 7);
  let m = t.match(/^(\d{1,2})\.(\d{1,2})(?:\.(\d{2,4}))?$/);
  if(m){
    let y = m[3] ? +m[3] : now.getFullYear(); if(y < 100) y += 2000;
    let d = new Date(y, +m[2] - 1, +m[1]);
    if(!m[3] && d < add(-60)) d = new Date(y + 1, +m[2] - 1, +m[1]);
    return d;
  }
  m = t.match(/^(\d{1,2})(?:\s+([а-я]+))?$/);
  if(m){
    const day = +m[1];
    if(m[2]){
      const mi = MON.findIndex(x => m[2].startsWith(x));
      if(mi < 0) return null;
      let d = new Date(now.getFullYear(), mi, day);
      if(d < add(-60)) d = new Date(now.getFullYear() + 1, mi, day);
      return d;
    }
    if(day < 1 || day > 31) return null;
    return day >= now.getDate() ? new Date(now.getFullYear(), now.getMonth(), day) : new Date(now.getFullYear(), now.getMonth() + 1, day);
  }
  return null;
}
/* дату пересчитываем только если сам токен поменялся, чтобы «@пт» не «уезжал» на следующую неделю */
function syncDate(b){
  if(b.type === "image" || b.habit) return;
  const m = b.text.match(DATE_RE);
  if(!m){ if(b.date){ delete b.date; delete b.dtok; } return; }
  const tok = m[1].toLowerCase();
  if(tok === b.dtok && b.date) return;
  const d = resolveDate(tok);
  if(d){ b.date = iso(d); b.dtok = tok; } else { delete b.date; delete b.dtok; }
}
function dateLabel(isoStr){
  const k = dayDiff(isoStr), d = fromIso(isoStr);
  const nice = WD[d.getDay()] + ", " + d.toLocaleDateString("ru-RU", {day:"numeric", month:"short"});
  if(k === 0) return {t:"сегодня", c:"today"};
  if(k === 1) return {t:"завтра", c:"soon"};
  if(k < 0) return {t:"просрочено · " + d.toLocaleDateString("ru-RU", {day:"numeric", month:"short"}), c:"late"};
  return {t:nice, c:k <= 7 ? "soon" : ""};
}
function dateTag(b){
  if(!b.date) return "";
  const L = dateLabel(b.date);
  return `<span class="dtag ${b.type === "check" && b.done ? "" : L.c}">${b.type === "check" && b.done && L.c === "late" ? fromIso(b.date).toLocaleDateString("ru-RU", {day:"numeric", month:"short"}) : L.t}</span>`;
}
/* Всё с датами из всех заметок: незакрытые чекбоксы и строки текста */
function datedItems(){
  const out = [];
  for(const x of everyNote()){
    if(x.n.kind === "budget") continue;
    for(const b of x.n.blocks){
      if(!b.date || b.type === "image" || (b.type === "check" && b.done)) continue;
      const k = dayDiff(b.date);
      if(k < 0 && b.type !== "check") continue;
      out.push({x, b, k});
    }
  }
  return out.sort((a, c) => a.k - c.k);
}
function todayCount(){ return datedItems().filter(i => i.k <= 0).length + (typeof habitsToday === "function" ? habitsToday().filter(h => !h.doneToday).length : 0); }
function renderToday(){
  const el = $("#listBody"), items = datedItems();
  const habits = typeof habitsToday === "function" ? habitsToday() : [];
  const line = i => `<button class="note" data-go="${i.x.n.id}"><span class="line">${i.b.type === "check" ? `<span class="lbox"></span>` : ""}<span class="lt">${esc(i.b.text.replace(DATE_RE, " ").trim() || "Без текста")}</span></span><span class="where">${esc(i.x.n.title || "Без названия")} · ${whereOf(i.x)}</span></button>`;
  const groups = [
    ["Просрочено", items.filter(i => i.k < 0)],

    ["Завтра", items.filter(i => i.k === 1)],
    ["На неделе", items.filter(i => i.k > 1 && i.k <= 7)],

  ];
  const hab = habits.length ? `<div class="sec">Привычки на сегодня</div>` + habits.map(h => `<button class="note" data-go="${h.x.n.id}"><span class="line"><span class="lbox"${h.doneToday ? ` style="background:var(--accent);border-color:var(--accent)"` : ""}></span><span class="lt">${esc(h.label)}</span></span><span class="where">${h.streak ? `серия ${h.streak} ${dayWord(h.streak)} · ` : ""}${esc(h.x.n.title || "Без названия")}</span></button>`).join("") : "";
  const body = groups.filter(g => g[1].length).map(g => `<div class="sec">${g[0]}</div>` + g[1].map(line).join("")).join("") + hab;
  el.innerHTML = `<div class="list-head"><div class="hd"><h2>Сегодня</h2><span class="where">${new Date().toLocaleDateString("ru-RU", {weekday:"long", day:"numeric", month:"long"})}</span></div><button class="icon-btn" id="closeView" title="Закрыть" aria-label="Закрыть">✕</button></div>
    <div class="notes">${body || `<div class="empty">Дел с датами пока нет. Допишите к строке дату: <b>@сегодня</b>, <b>@завтра</b>, <b>@пт</b>, <b>@20.10</b> или <b>@20 окт</b>, и она появится здесь.</div>`}</div>`;
}

/* ================= Привычки =================
   «[.] Зарядка @каждый день», «@ежедневно», «@будни», «@выходные», «@пн,ср,пт».
   Галочка ставится на сегодня и сама снимается на следующий день; считается серия дней подряд. */
const HABIT_RE = /(?:^|\s)@(каждый день|ежедневно|будни|выходные|(?:пн|вт|ср|чт|пт|сб|вс)(?:\s*,\s*(?:пн|вт|ср|чт|пт|сб|вс))+)(?=$|[\s.;!?)])/i;
function syncHabit(b){
  if(b.type !== "check"){ if(b.habit) delete b.habit; return; }
  const m = b.text.match(HABIT_RE);
  if(!m){ if(b.habit){ delete b.habit; } return; }
  const t = m[1].toLowerCase().replace(/\s+/g, "");
  b.habit = t === "каждыйдень" || t === "ежедневно" ? "daily" : t === "будни" ? "weekdays" : t === "выходные" ? "weekend" : t;
  b.hist = b.hist || {};
  delete b.date; delete b.dtok;
}
function habitDue(spec, d){
  const w = d.getDay();
  if(spec === "daily") return true;
  if(spec === "weekdays") return w >= 1 && w <= 5;
  if(spec === "weekend") return w === 0 || w === 6;
  return spec.split(",").includes(WD[w]);
}
function habitStreak(b){
  const h = b.hist || {}; let n = 0;
  const d = day0();
  if(!h[iso(d)]) d.setDate(d.getDate() - 1);   // сегодня ещё не отмечено — серия не прерывается
  for(let i = 0; i < 400; i++){
    if(habitDue(b.habit, d)){ if(h[iso(d)]) n++; else break; }
    d.setDate(d.getDate() - 1);
  }
  return n;
}
/* показать галочку за сегодня; старую историю подрезаем */
function refreshHabit(b){
  const h = b.hist || (b.hist = {}), today = iso(day0());
  b.done = !!h[today];
  const keys = Object.keys(h);
  if(keys.length > 130){ const cut = iso(new Date(Date.now() - 120 * 864e5)); keys.forEach(k => { if(k < cut) delete h[k]; }); }
}
function habitTag(b){
  const h = b.hist || {}, st = habitStreak(b);
  let dots = "";
  for(let i = 6; i >= 0; i--){
    const d = day0(); d.setDate(d.getDate() - i);
    const due = habitDue(b.habit, d), k = iso(d);
    dots += `<i class="${!due ? "off" : h[k] ? "y" : ""}${i === 0 ? " t" : ""}" title="${d.toLocaleDateString("ru-RU", {weekday:"short", day:"numeric"})}"></i>`;
  }
  return `<span class="htag">${st ? `<span class="fire" title="Дней подряд">🔥 ${st}</span>` : ""}<span class="hdots">${dots}</span></span>`;
}
function habitsToday(){
  const out = [], today = day0();
  for(const x of everyNote()){
    if(x.n.kind === "budget") continue;
    for(const b of x.n.blocks){
      if(!b.habit || !habitDue(b.habit, today)) continue;
      out.push({x, b, label:b.text.replace(HABIT_RE, " ").trim() || "Привычка", doneToday:!!(b.hist || {})[iso(today)], streak:habitStreak(b)});
    }
  }
  return out.sort((a, c) => a.doneToday - c.doneToday);
}

/* ================= Корзина ================= */
const TRASH_DAYS = 30;
function toTrash(kind, item, from){
  const now = Date.now();
  state.trash = state.trash || [];
  state.trash.unshift({id:item.id, kind, at:now, from, item:JSON.parse(JSON.stringify(item))});
  const ids = [item.id];
  if(kind === "folder"){ item.notes.forEach(n => ids.push(n.id)); item.threads.forEach(t => { ids.push(t.id); t.notes.forEach(n => ids.push(n.id)); }); }
  if(kind === "thread") item.notes.forEach(n => ids.push(n.id));
  ids.forEach(id => state.deleted[id] = now);
}
function trashNotes(e){
  const it = e.item;
  return e.kind === "note" ? [it] : e.kind === "thread" ? it.notes : [...it.notes, ...it.threads.flatMap(t => t.notes)];
}
/* Восстановление: свежая дата правки перекрывает отметку об удалении на всех устройствах */
function restore(id){
  const i = state.trash.findIndex(e => e.id === id); if(i < 0) return;
  const e = state.trash[i], it = JSON.parse(JSON.stringify(e.item)), now = Date.now();
  const stamp = x => { x.updated = now; delete state.deleted[x.id]; };
  const ensureFolder = () => {
    let f = state.folders.find(x => x.id === e.from?.folder);
    if(!f){ f = state.folders[0]; }
    if(!f){ f = {id:uid(), name:"Восстановленное", updated:now, notes:[], threads:[]}; state.folders.push(f); }
    return f;
  };
  if(e.kind === "folder"){
    stamp(it); it.notes.forEach(stamp); it.threads.forEach(t => { stamp(t); t.notes.forEach(stamp); });
    state.folders.push(it); state.cur = {folder:it.id, thread:null, note:it.notes[0]?.id || null};
  } else if(e.kind === "thread"){
    stamp(it); it.notes.forEach(stamp);
    const f = ensureFolder(); f.threads.push(it); state.cur = {folder:f.id, thread:it.id, note:it.notes[0]?.id || null};
  } else {
    stamp(it);
    const f = ensureFolder(); const t = f.threads.find(x => x.id === e.from?.thread);
    (t || f).notes.push(it); state.cur = {folder:f.id, thread:t ? t.id : null, note:it.id};
  }
  state.trash.splice(i, 1);
  view = null; reading = e.kind === "note"; changed(); render();
}
function purgeTrash(entries){
  removeImagesOf(entries.flatMap(trashNotes));
  const ids = new Set(entries.map(e => e.id));
  state.trash = state.trash.filter(e => !ids.has(e.id));
  changed(); render();
}

function shortDay(isoStr){
  const k = dayDiff(isoStr);
  return k === 0 ? "сегодня" : k === -1 ? "вчера" : fromIso(isoStr).toLocaleDateString("ru-RU", {day:"numeric", month:"short"});
}

function budgetOf(n){
  const today = new Date().getDate();
  let balance = null, balAt = 0, adults = 0, kids = 0, people = 0;
  const incomes = [], pays = [], over = {}, spends = [], deps = [], goals = [], tags = {};
  // свой курс из строк «Курс: 92», «Курс €: 100»
  const myRate = {};
  for(const b of n.blocks){
    if(b.type !== "text") continue;
    const m = b.text.trim().match(RATE_RE);
    if(m){ const v = parseMoney(m[2]); if(v) myRate[m[1] ? (curOf(m[1]) || "USD") : "USD"] = v; }
  }
  const usedCur = new Set(); let noRate = false;
  // сумма в рублях; доллары и евро пересчитываются по курсу
  const money = str => {
    const v = parseMoney(str); if(v == null) return null;
    const cur = curOf(str); if(!cur) return {rub:v};
    const r = myRate[cur] || FX.rates?.[cur];
    if(!r){ noRate = true; return null; }
    usedCur.add(cur); return {rub:v * r, cur, orig:v};
  };
  for(const b of n.blocks){
    if(b.type === "image") continue;
    const t = b.text.trim();
    let m;
    if(b.type === "text"){
      if(t.match(RATE_RE)) continue;
      if((m = t.match(BAL_RE))){ const v = money(m[2]); if(v){ balance = v.rub; balAt = b.at || 0; } continue; }
      const em = t.match(EXP_RE), dpm = !em && t.match(DEP_RE);
      if(em || dpm){
        const body = (em || dpm)[1].replace(ETOK_RE, " ");
        const mv = money(body);
        if(mv){
          const label = labelOf(body);
          const it = {b, amount:mv.rub, cur:mv.cur, orig:mv.orig, label, day:b.day || iso(day0()), at:b.at || 0};
          if(em){ it.cat = catOf(label); spends.push(it); } else deps.push(it);
        }
        continue;
      }
      if((m = t.match(GOAL_RE))){ goals.push(parseGoal(m[1], money, b)); continue; }
      if((m = t.match(PAY_RE))){
        // «Зарплата: 10-го 40 000», «Аванс 25 числа 30к», «Зарплата: 100 000»
        let rest = unThousand(m[2]);
        const dm = rest.match(/(?:^|[^\d])(\d{1,2})(?!\d)(?:\s*-?\s*(?:го|е|ого))?(?:\s*числа)?/i);
        let day = null;
        if(dm && +dm[1] >= 1 && +dm[1] <= 31){ day = +dm[1]; rest = rest.replace(dm[0], " "); }
        const mv = money(rest);
        const amount = mv && (mv.cur || mv.rub >= 100) ? mv.rub : null;
        incomes.push({day, amount, cur:mv?.cur, orig:mv?.orig, name:m[1][0].toUpperCase() + m[1].slice(1).toLowerCase()});
        continue;
      }
      if((m = t.match(PEOPLE_RE))){
        const k = m[1].toLowerCase(), v = +m[2];
        if(k === "взрослых") adults = v; else if(k === "детей") kids = v; else people = v;
        continue;
      }
      if((m = t.match(NEED_RE))){
        const key = NEED_KEY[m[1].toLowerCase()], pm = m[2].match(/(\d+(?:[.,]\d+)?)\s*%/);
        if(pm) over[key] = {pct: parseFloat(pm[1].replace(",", ".")) / 100};
        else { const v = money(m[2]); if(v) over[key] = {sum: v.rub}; }
        continue;
      }
      continue;
    }
    if(b.type !== "check") continue;
    const dm = t.match(DUE_RE);
    const due = dm ? +(dm[1] || dm[2]) : null;
    const rest = dm ? t.replace(dm[0], " ") : t;
    const mv = money(rest);
    if(!mv) continue;
    const amount = mv.rub;
    const label = unThousand(rest).replace(/\d+(?:[.,]\d+)?\s*(тыс|к|k|₽|р\.?|руб\.?)?(?![a-zа-яё])/i, "").replace(/\$|€|\busd\b|\beur\b|евро|долл\S*|дол\.|бакс\S*/gi, "").replace(/[—–\-:,.]+\s*$/, "").replace(/\s+/g, " ").trim() || "Платёж";
    const overdue = !b.done && due != null && due < today;
    pays.push({b, label, amount, cur:mv.cur, orig:mv.orig, due, done:b.done, overdue, left: due != null && due >= today ? due - today : null});
  }
  const total = pays.reduce((s, x) => s + x.amount, 0);
  const paid = pays.filter(x => x.done).reduce((s, x) => s + x.amount, 0);
  const unpaid = total - paid;
  const payDays = incomes.filter(x => x.day).map(x => x.day);
  const daysToPay = payDays.length ? Math.min(...payDays.map(daysUntil)) : null;
  const nextIncome = payDays.length ? incomes.filter(x => x.day).sort((a, b) => daysUntil(a.day) - daysUntil(b.day))[0] : null;
  const open = pays.filter(x => !x.done).sort((a, b) => (b.overdue - a.overdue) || ((a.left ?? 99) - (b.left ?? 99)));

  /* План на месяц: сначала необходимое, потом накопления, потом развлечения из того, что осталось */
  const income = incomes.reduce((s, x) => s + (x.amount || 0), 0);
  const heads = people || (adults + kids) || 0;
  const pick = (key, auto) => over[key] ? (over[key].sum != null ? over[key].sum : income * over[key].pct) : auto;
  const food = heads ? pick("food", Math.round(NORM.foodOne * Math.pow(heads, NORM.foodPow) / 100) * 100) : (over.food ? pick("food", 0) : null);
  const transport = income ? pick("transport", Math.round(income * NORM.transportPct / 100) * 100) : (over.transport?.sum ?? null);
  const needs = total + (food || 0) + (transport || 0);
  let save = null, fun = null, rest = null, saveCut = false;
  if(income){
    const afterNeeds = income - needs;
    const saveTarget = pick("save", Math.round(income * NORM.savePct / 100) * 100);
    save = over.save ? saveTarget : Math.max(0, Math.min(saveTarget, afterNeeds));
    saveCut = !over.save && save < saveTarget;
    fun = over.fun ? pick("fun", 0) : Math.max(0, Math.min(Math.round(income * NORM.funPct / 100) * 100, afterNeeds - save));
    rest = afterNeeds - save - fun;
  } else {
    if(over.fun?.sum != null) fun = over.fun.sum;
    if(over.save?.sum != null) save = over.save.sum;
  }
  const plan = income || heads ? {income, heads, food, transport, fun, save, saveCut, rest, needs, needsPct: income ? needs / income : null, over} : null;

  /* Свободно до ближайшей зарплаты: вычитаем только платежи, которые наступают раньше неё
     (и просроченные, и без даты). Платёж в день зарплаты или позже оплачивается из неё. */
  const dueBeforePay = x => !x.done && (x.overdue || x.left == null || daysToPay == null || x.left < daysToPay);
  const nowPays = pays.filter(dueBeforePay);
  const laterPays = pays.filter(x => !x.done && !dueBeforePay(x));
  const dueNow = nowPays.reduce((s, x) => s + x.amount, 0);
  /* Траты и пополнения целей, записанные после обновления «Есть», уже ушли с баланса */
  const todayIso = iso(day0());
  const afterBal = x => balance != null && x.at >= balAt;
  const spentSince = spends.filter(afterBal).reduce((s, x) => s + x.amount, 0);
  const depSince = deps.filter(afterBal).reduce((s, x) => s + x.amount, 0);
  const todaySub = spends.filter(x => afterBal(x) && x.day === todayIso).reduce((s, x) => s + x.amount, 0);
  const free = balance != null ? balance - dueNow - spentSince - depSince : null;
  // лимит на день считается от начала дня, чтобы траты сегодня не уменьшали его самого
  const perDay = free != null && daysToPay ? (free + todaySub) / daysToPay : null;

  /* Траты за месяц по категориям */
  const curM = ym(), pd = new Date(); pd.setDate(1); pd.setMonth(pd.getMonth() - 1);
  const prevM = pd.getFullYear() + "-" + String(pd.getMonth() + 1).padStart(2, "0");
  const by = {food:0, transport:0, fun:0, other:0};
  let spentMonth = 0, spentPrev = 0, spentToday = 0;
  for(const x of spends){
    const mk = x.day.slice(0, 7);
    if(mk === curM){ by[x.cat] += x.amount; spentMonth += x.amount; }
    else if(mk === prevM) spentPrev += x.amount;
    if(x.day === todayIso) spentToday += x.amount;
    tags[x.b.id] = `<span class="due" title="${CAT_NAME[x.cat]}">${shortDay(x.day)} · ${CAT_NAME[x.cat].toLowerCase()}</span>`;
  }
  const spent = spends.length ? {by, month:spentMonth, prev:spentPrev, today:spentToday, since:spentSince, count:spends.filter(x => x.day.slice(0, 7) === curM).length} : null;

  /* Цели: сколько накоплено, сколько откладывать в месяц до срока */
  const unmatched = [];
  for(const d of deps){
    const low = d.label.toLowerCase();
    let g = goals.find(g => g.stems.some(s => low.includes(s)));
    if(!g && goals.length === 1) g = goals[0];
    if(g){ (g.deps = g.deps || []).push(d); tags[d.b.id] = `<span class="due paid">${shortDay(d.day)} · ${esc(g.name)}</span>`; }
    else { unmatched.push(d); tags[d.b.id] = `<span class="due late">${goals.length ? "к какой цели?" : "нет цели"}</span>`; }
  }
  let needMonthly = 0;
  for(const g of goals){
    const ds = g.deps || [];
    g.saved = g.start + ds.reduce((s, x) => s + x.amount, 0);
    g.thisMonth = ds.filter(x => x.day.slice(0, 7) === curM).reduce((s, x) => s + x.amount, 0);
    g.left = g.target != null ? Math.max(0, g.target - g.saved) : null;
    g.pct = g.target ? Math.min(100, g.saved / g.target * 100) : null;
    g.reached = g.target != null && g.saved >= g.target;
    if(g.deadline && g.left){
      const days = Math.round((g.deadline - day0()) / 864e5);
      g.days = days;
      if(days <= 0) g.late = true;
      else { g.months = days / 30.44; g.perMonth = Math.ceil(g.left / Math.max(1, g.months) / 100) * 100; needMonthly += g.perMonth; }
    }
    tags[g.b.id] = g.target ? `<span class="due${g.reached ? " paid" : ""}">${g.reached ? "готово" : Math.floor(g.pct) + "%"}</span>` : `<span class="due late">нужна сумма</span>`;
  }
  // цели без срока: при плане «Отложить» прикидываем, когда накопится
  const saveBudget = plan && plan.save ? plan.save : null;
  const openGoals = goals.filter(g => !g.deadline && g.left);
  if(saveBudget && openGoals.length){
    const share = Math.max(0, saveBudget - needMonthly) / openGoals.length;
    for(const g of openGoals) g.eta = share ? Math.ceil(g.left / share) : null;
  }
  const goalsInfo = goals.length ? {list:goals, needMonthly, saveBudget, thisMonth:deps.filter(x => x.day.slice(0, 7) === curM).reduce((s, x) => s + x.amount, 0), unmatched} : null;
  const dimNow = new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0).getDate();
  const livingMonth = (food || 0) + (transport || 0) + (fun || 0);
  const livingUntilPay = livingMonth && daysToPay ? Math.round(livingMonth * daysToPay / dimNow / 100) * 100 : null;

  /* По зарплатам: какие платежи и сколько на жизнь приходится на каждый период */
  let periods = [];
  const withDays = incomes.filter(x => x.day).sort((a, b) => a.day - b.day);
  if(withDays.length >= 2){
    const now = new Date(), dim = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
    const living = (food || 0) + (transport || 0) + (fun || 0);
    periods = withDays.map((x, i) => {
      const from = x.day, to = withDays[(i + 1) % withDays.length].day;
      const len = to > from ? to - from : dim - from + to;
      const inP = d => to > from ? d >= from && d < to : d >= from || d < to;
      // период, начинающийся в этом месяце: платежи с числом не раньше начала приходятся на этот месяц,
      // и уже оплаченные из них не считаются; остальные — уже следующий месяц, их нужно будет платить снова
      const thisMonth = d => from >= today && d >= from;
      const ps = pays.filter(p => p.due != null && inP(p.due) && !(p.done && thisMonth(p.due)));
      const sum = ps.reduce((s, p) => s + p.amount, 0);
      const life = Math.round(living * len / dim);
      return {x, from, to, len, sum, ps, count: ps.length, life, soon: daysUntil(from), left: x.amount != null ? x.amount - sum - life : null};
    }).sort((a, b) => a.soon - b.soon);
    // остаток переходит в следующий период
    let carry = 0;
    for(const p of periods){ if(p.left == null) break; p.carry = carry; p.total = carry + p.left; carry = p.total; }
  }
  const fx = usedCur.size || noRate ? {cur:[...usedCur], noRate, rate:Object.fromEntries([...usedCur].map(c => [c, myRate[c] || FX.rates?.[c]])), mine:myRate} : null;
  return {fx, balance, pays, total, paid, unpaid, free, dueNow, laterPays, daysToPay, perDay, livingUntilPay, next: open[0] || null, nextIncome, plan, periods,
    spends, spent, todaySub, depSince, goals:goalsInfo, tags};
}
function dayWord(n){ const a = n % 10, b = n % 100; return a === 1 && b !== 11 ? "день" : a >= 2 && a <= 4 && (b < 12 || b > 14) ? "дня" : "дней"; }
function peopleWord(n){ const a = n % 10, b = n % 100; return a >= 2 && a <= 4 && (b < 12 || b > 14) ? "человека" : "человек"; }
const pctOf = (v, inc) => inc ? Math.round(v / inc * 100) + "%" : "";
function budgetPanel(n){
  const B = budgetOf(n);

  if(B.balance == null && !B.pays.length && !B.plan && !B.spends.length && !B.goals) return `<div class="budget" id="budgetPanel">${help}</div>`;

  const payName = ni ? `${GEN[ni.name.toLowerCase()] || ni.name.toLowerCase()} ${ni.day}-го` : "зарплаты";
  const laterSum = B.laterPays.reduce((s, x) => s + x.amount, 0);
  const main = B.free != null
    ? `<div><span class="bl">Свободно до ${ni ? payName : "зарплаты"}</span><span class="bv${B.free < 0 ? " neg" : ""}">${rub(B.free)}</span>${
        B.perDay != null ? `<span class="bs">≈ ${rub(Math.max(0, B.perDay))} в день · ${B.daysToPay} ${dayWord(B.daysToPay)}${ni && ni.amount ? `, потом придёт ${rub(ni.amount)}` : ""}</span>`
        : B.daysToPay === 0 ? `<span class="bs">Зарплата сегодня</span>` : ""}
      ${B.dueNow || B.spent?.since || B.depSince ? `<span class="bs">Уже вычтено: ${[B.dueNow ? `платежи до зарплаты ${rub(B.dueNow)}` : "", B.spent?.since ? `траты ${rub(B.spent.since)}` : "", B.depSince ? `на цели ${rub(B.depSince)}` : ""].filter(Boolean).join(", ")}</span>` : ""}
      ${B.perDay != null && B.todaySub ? `<span class="bg-today${B.todaySub > B.perDay ? " neg" : ""}">Сегодня потрачено ${rub(B.todaySub)} — ${B.todaySub > B.perDay ? `больше дневной нормы на ${rub(B.todaySub - Math.max(0, B.perDay))}` : `можно ещё ${rub(B.perDay - B.todaySub)}`}</span>` : ""}
      ${laterSum ? `<span class="bs">Из ${payName} оплатить: ${B.laterPays.map(x => esc(x.label) + " " + rub(x.amount)).join(", ")}</span>` : ""}
      ${B.livingUntilPay != null && B.free != null && B.livingUntilPay > B.free ? `<span class="bs neg">На еду и транспорт до зарплаты по плану нужно ≈ ${rub(B.livingUntilPay)}</span>` : ""}</div>`
    : `<div><span class="bl">Свободно сейчас</span><span class="bs">Добавьте строку <b>Есть: сумма</b>, чтобы посчитать остаток</span></div>`;
  const pct = B.total ? Math.round(B.paid / B.total * 100) : 0;
  const nx = B.next;
  const nextTxt = nx ? `<div class="bg-next${nx.overdue ? " late" : ""}">${nx.overdue ? "Просрочен" : "Ближайший"}: ${esc(nx.label)} — ${rub(nx.amount)}${
      nx.overdue ? `, срок был ${nx.due}-го` : nx.left === 0 ? ", сегодня" : nx.left != null ? `, через ${nx.left} ${dayWord(nx.left)}` : ""}</div>`
    : B.pays.length ? `<div class="bg-next">Все обязательные платежи этого месяца оплачены</div>` : "";

      <table>
        ${P.income ? `<tr class="inc"><td>Доход</td><td>${rub(P.income)}</td><td></td></tr>` : ""}
        ${B.total ? row("Обязательные платежи", B.total) : ""}
        ${row("Еда", P.food, P.over.food ? mine("food") : P.heads ? `≈ ${rub(P.food / P.heads)} на человека` : "")}
        ${row("Транспорт", P.transport, mine("transport"))}
        ${row("Развлечения", P.fun, P.over.fun ? mine("fun") : P.heads && P.fun ? `≈ ${rub(P.fun / P.heads)} на человека` : "")}

      </table>
      ${P.needsPct != null ? `<div class="bg-note${Math.round(P.needsPct * 100) > 50 ? " warn" : ""}">На необходимое (платежи, еда, транспорт) уходит ${Math.round(P.needsPct * 100)}% дохода${Math.round(P.needsPct * 100) > 50 ? ` — больше рекомендуемых 50%` : `, это в пределах рекомендуемых 50%`}.</div>`
        : !P.income ? `<div class="bg-note">Добавьте сумму зарплаты, например <code>Зарплата: 10-го 40 000</code>, чтобы посчитать транспорт, развлечения и накопления.</div>` : ""}
      ${!P.heads && P.income ? `<div class="bg-note">Добавьте строку <code>Людей: 2</code>, чтобы посчитать еду.</div>` : ""}
    </div>`;
  }
  const per = B.periods.length ? `<div class="plan"><span class="bl">По зарплатам</span><table>${B.periods.map(p =>
      `<tr><td>${esc(p.x.name)} ${p.from}-го${p.soon === 0 ? " · сегодня" : ` · через ${p.soon} ${dayWord(p.soon)}`}${p.x.amount ? `<span class="pn">${rub(p.x.amount)}${p.x.cur ? ` (${fmtCur(p.x.orig, p.x.cur)})` : ""} на ${p.len} ${dayWord(p.len)}, до ${p.to}-го</span>` : ""}</td><td>${p.count ? `платежи ${rub(p.sum)}<span class="pn">${p.ps.map(q => esc(q.label) + " " + q.due + "-го").join(", ")}</span>` : "без платежей"}<span class="pn">на жизнь ≈ ${rub(p.life)}</span></td><td>${p.total != null ? `<b class="${p.total < 0 ? "neg" : ""}">${p.total < 0 ? "−" : ""}${rub(Math.abs(p.total))}</b><span class="pn">${p.total < 0 ? "не хватит" : "останется"}${p.carry ? `, с учётом ${rub(p.carry)} с прошлой` : ""}</span>` : ""}</td></tr>`).join("")}</table></div>` : "";

    ${B.pays.length ? `<div class="bg-grid">
      ${B.balance != null ? `<div><span class="bl">Есть</span><b>${rub(B.balance)}</b></div>` : ""}

      <div><span class="bl">Оплачено</span><b>${rub(B.paid)}</b> <span class="nw">из ${rub(B.total)}</span></div>

    ${fxHtml(B)}${nextTxt}${spentHtml(B)}${planHtml}${per}${goalsHtml(B)}${help}</div>`;
}
function spentHtml(B){
  const S = B.spent; if(!S) return "";
  const P = B.plan, now = new Date();
  const norm = {food:P?.food, transport:P?.transport, fun:P?.fun};
  const rows = CATS.map(c => c[0]).filter(k => S.by[k] || norm[k]).map(k => {
    const v = S.by[k], lim = norm[k], over = lim && v > lim;
    const note = lim ? (over ? `из ${rub(lim)} по плану · перерасход ${rub(v - lim)}` : `из ${rub(lim)} по плану · осталось ${rub(lim - v)}`) : "";
    return `<tr><td>${CAT_NAME[k]}${note ? `<span class="pn${over ? " neg" : ""}">${note}</span>` : ""}</td><td>${rub(v)}</td><td class="${over ? "neg" : ""}">${lim ? Math.round(v / lim * 100) + "%" : ""}</td></tr>`;
  }).join("");
  const prevName = MONTH_IN[(now.getMonth() + 11) % 12];
  return `<div class="plan"><span class="bl">Траты в ${MONTH_IN[now.getMonth()]}</span>
    ${S.month || rows ? `<table>${rows}<tr class="inc"><td>Всего${S.count ? `<span class="pn">${S.count} ${S.count % 10 === 1 && S.count % 100 !== 11 ? "запись" : S.count % 10 >= 2 && S.count % 10 <= 4 && (S.count % 100 < 12 || S.count % 100 > 14) ? "записи" : "записей"}${S.today ? ` · сегодня ${rub(S.today)}` : ""}</span>` : ""}</td><td>${rub(S.month)}</td><td></td></tr></table>` : `<div class="bg-note">В этом месяце трат пока нет.</div>`}
    ${S.prev ? `<div class="bg-note">В ${prevName}: ${rub(S.prev)}</div>` : ""}
  </div>`;
}
function goalsHtml(B){
  const G = B.goals; if(!G) return "";
  const D = d => d.toLocaleDateString("ru-RU", {day:"numeric", month:"long", ...(d.getFullYear() !== new Date().getFullYear() ? {year:"numeric"} : {})}).replace(/\s*г\.$/, "");
  const items = G.list.map(g => {
    if(g.target == null) return `<div class="goal"><div class="g-top"><b>${esc(g.name)}</b><span>${rub(g.saved)}</span></div><span class="pn">Допишите сумму цели, например <code>Цель: ${esc(g.name)} 100 000</code></span></div>`;
    const bits = [];
    if(g.reached) bits.push("Цель достигнута 🎉");
    else {
      bits.push(`осталось ${rub(g.left)}`);
      if(g.late) bits.push(`<span class="neg">срок ${D(g.deadline)} прошёл</span>`);
      else if(g.deadline){ const mo = Math.max(1, Math.round(g.months)); bits.push(`к ${D(g.deadline)}${g.days < 45 ? ` · ${g.days} ${dayWord(g.days)}` : ` · ${mo} ${monthWord(mo)}`}`, `откладывать ≈ ${rub(g.perMonth)} в месяц`); }
      else if(g.eta) bits.push(`при плане «Отложить» ≈ ${g.eta} ${monthWord(g.eta)}`);
    }
    if(g.thisMonth) bits.push(`в этом месяце +${rub(g.thisMonth)}`);
    return `<div class="goal${g.reached ? " reached" : ""}"><div class="g-top"><b>${esc(g.name)}</b><span>${rub(g.saved)} из ${rub(g.target)}${g.cur ? ` (${fmtCur(g.orig, g.cur)})` : ""}</span></div><div class="bar" title="${Math.floor(g.pct)}%"><i style="width:${g.pct}%"></i></div><span class="pn">${bits.join(" · ")}</span></div>`;
  }).join("");
  let sum = "";
  if(G.needMonthly && G.saveBudget != null){
    const gap = G.needMonthly - G.saveBudget;
    sum = `<div class="bg-note${gap > 0 ? " warn" : ""}">На цели со сроком нужно откладывать ${rub(G.needMonthly)} в месяц, по плану откладывается ${rub(G.saveBudget)}${gap > 0 ? ` — не хватает ${rub(gap)}. Увеличьте <code>Копить:</code> или сдвиньте срок.` : " — хватает."}</div>`;
  } else if(G.needMonthly) sum = `<div class="bg-note">На цели со сроком нужно откладывать ${rub(G.needMonthly)} в месяц.</div>`;
  if(G.thisMonth && G.saveBudget) sum += `<div class="bg-note">В этом месяце отложено ${rub(G.thisMonth)} из ${rub(G.saveBudget)} по плану.</div>`;
  if(G.unmatched.length) sum += `<div class="bg-note warn">Не понял, к какой цели: ${G.unmatched.map(d => esc(d.b.text.trim())).join(", ")}. Допишите слово из названия цели.</div>`;
  return `<div class="plan"><span class="bl">Цели</span>${items}${sum}</div>`;
}
function fxHtml(B){
  if(!B.fx) return "";
  if(B.fx.noRate && !B.fx.cur.length) return `<div class="bg-note warn">Нет курса валют: подключитесь к интернету или добавьте строку <code>Курс: 92</code>.</div>`;
  const parts = B.fx.cur.map(c => `1 ${CUR_SIGN[c]} = ${B.fx.rate[c].toLocaleString("ru-RU", {maximumFractionDigits:2})} ₽`).join(", ");
  const own = B.fx.cur.every(c => B.fx.mine[c]);
  const src = own ? "ваш курс" : FX.src === "cbr" ? `курс ЦБ на ${new Date(FX.at).toLocaleDateString("ru-RU", {day:"numeric", month:"short"})}`
    : `рыночный курс на ${new Date(FX.at).toLocaleDateString("ru-RU", {day:"numeric", month:"short"})}, <a href="https://www.exchangerate-api.com" target="_blank" rel="noopener">ExchangeRate-API</a>`;
  const inc = B.plan ? "" : "";
  return `<div class="bg-note">Курс: ${parts} · ${src}${B.fx.noRate ? ". Для части сумм курса нет" : ""}</div>`;
}
function dueTag(info){
  if(!info) return "";
  if(info.done) return `<span class="due paid">оплачено</span>`;
  if(info.overdue) return `<span class="due late">просрочен</span>`;
  if(info.left === 0) return `<span class="due soon">сегодня</span>`;
  if(info.left != null) return `<span class="due${info.left <= 3 ? " soon" : ""}">через ${info.left} ${dayWord(info.left)}</span>`;
  return "";
}
/* Новый месяц — галочки платежей снимаются */
function budgetMonthReset(n){
  const now = ym();
  if(!n.month){ n.month = now; return false; }
  if(n.month === now) return false;
  n.blocks.forEach(b => { if(b.type === "check") b.done = false; });
  n.month = now; n.updated = Date.now(); changed();
  return true;
}
const BUDGET_TEMPLATE = ["Есть: 50 000", "Зарплата: 10-го 40 000", "Зарплата: 25-го 60 000", "Людей: 2", "[.] Аренда 30 000 до 5", "[.] Связь и интернет 1 200 до 15", "[.] Коммуналка 6 000 до 20", "Цель: Подушка безопасности 100 000"];

/* Строка «[.] слово» становится чекбоксом; «[x] слово» — отмеченным */
const CHECK_RE = /^\[([.\sxх]?)\]\s/i;
const PRIO_RE = /^(!!|!|~)\s/;
const PRIO_OF = {"!!":"red", "!":"yellow", "~":"green"};
function parseLine(line){
  const r = {id:uid(), type:"text", text:line, done:false};
  for(let k = 0; k < 2; k++){
    let m = r.text.match(CHECK_RE);
    if(m && r.type === "text"){ r.type = "check"; r.done = /[xх]/i.test(m[1]); r.text = r.text.slice(m[0].length); continue; }
    m = r.text.match(PRIO_RE);
    if(m && !r.prio){ r.prio = PRIO_OF[m[1]]; r.text = r.text.slice(m[0].length); continue; }
    break;
  }
  return r;
}
function focusBlock(id, pos){
  const t = document.querySelector(`[data-b="${id}"] textarea`); if(!t) return;
  t.focus(); const p = pos == null ? t.value.length : pos; t.setSelectionRange(p, p);
}
function redraw(focusId, pos){ touch(); renderEditor(); refreshSide(); if(focusId) focusBlock(focusId, pos); }
function editableNear(n, i, dir){ for(let j = i + dir; j >= 0 && j < n.blocks.length; j += dir) if(n.blocks[j].type !== "image") return j; return -1; }

  if(t.dataset.restore){ restore(t.dataset.restore); return; }

  if(id === "noEmpty"){ confirmEmpty = false; renderList(); return; }

  if(id === "budgetBtn"){

    n.kind = "budget"; n.month = ym();
    const empty = !n.blocks.some(b => b.type !== "image" && b.text.trim());
    if(empty){ n.blocks = BUDGET_TEMPLATE.map(parseLine); if(!n.title.trim()) n.title = "Бюджет"; }

  }
  if(t.dataset.prio){ const n = note(); n.prio = n.prio === t.dataset.prio ? null : t.dataset.prio; redraw(); return; }
  if(t.classList.contains("pb")){

  }
  if(t.dataset.f || t.dataset.t){ view = null; query = ""; $("#q").value = ""; }
  if(t.dataset.f){
    state.cur.folder = t.dataset.f; state.cur.thread = null; state.cur.note = folder().notes[0]?.id || null;
    confirmDel = null; reading = false; saveLocal(); render(); return;
  }
  if(t.dataset.t){

    confirmDel = null; reading = false; saveLocal(); render(); return;
  }
  if(t.dataset.n){ state.cur.note = t.dataset.n; confirmDel = null; reading = true; saveLocal(); render(); return; }
  if(id === "syncBtn"){ openSheet(); return; }
  if(id === "mascotBtn"){ switchMascot(); return; }
  if(id === "addFolder" || id === "addFolderM"){
    const f = {id:uid(), name:"Новая папка", updated:now, notes:[], threads:[]};
    state.folders.push(f); state.cur = {folder:f.id, thread:null, note:null};
    editing = "folder:" + f.id; reading = false; changed(); render(); return;
  }
  if(id === "addThread" || id === "addThread2"){
    const f = folder(); if(!f) return;
    const th = {id:uid(), name:"Новый тред", updated:now, notes:[]};
    f.threads.push(th); state.cur.thread = th.id; state.cur.note = null;
    editing = "thread:" + th.id; reading = false; changed(); render(); return;
  }
  if(id === "renameCur"){ editing = thread() ? "thread:" + thread().id : "folder:" + folder().id; render(); return; }
  if(id === "delCur"){ confirmDel = thread() ? "thread" : "folder"; renderList(); return; }
  if(id === "yesDel"){
    const f = folder(), th = thread();
    if(th){
      toTrash("thread", th, {folder:f.id});
      f.threads = f.threads.filter(x => x.id !== th.id);
      state.cur.thread = null; state.cur.note = f.notes[0]?.id || null;
    } else {
      const ns = [...f.notes, ...f.threads.flatMap(x => x.notes)];
      toTrash("folder", f, {});
      state.folders = state.folders.filter(x => x.id !== f.id);
      state.cur = {folder:state.folders[0]?.id || null, thread:null, note:null};
    }
    confirmDel = null; reading = false; changed(); render(); return;
  }
  if(id === "noDel"){ confirmDel = null; render(); return; }
  if(id === "addNote"){
    const n = {id:uid(), title:"", updated:now, blocks:[{id:uid(),type:"text",text:"",done:false}]};
    place().notes.push(n); state.cur.note = n.id; reading = true; changed(); render(); $("#title")?.focus(); return;
  }
  if(id === "delNote"){ confirmDel = "note"; renderEditor(); return; }
  if(id === "yesDelNote"){
    const p = place(), n = note(); toTrash("note", n, {folder:folder().id, thread:thread()?.id || null});
    p.notes = p.notes.filter(x => x.id !== n.id); state.cur.note = null;
    confirmDel = null; reading = false; changed(); render(); return;
  }
  if(id === "back"){ reading = false; render(); return; }
  if(id === "addImg"){ $("#imgFile").click(); return; }
  if(t.classList.contains("del")){
    const n = note(), bid = t.closest(".block").dataset.b, b = n.blocks.find(x => x.id === bid);
    if(b && b.path && sb && session) sb.storage.from("images").remove([b.path]).catch(() => {});
    n.blocks = n.blocks.filter(x => x.id !== bid);
    if(!n.blocks.some(x => x.type !== "image")) n.blocks.push({id:uid(), type:"text", text:"", done:false});
    redraw(); return;
  }
});

$("#q").addEventListener("input", e => { query = e.target.value; const was = view; view = null; renderList(); if(was === "trash") renderFolders(); });
